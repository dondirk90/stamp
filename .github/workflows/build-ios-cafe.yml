name: Build iOS Cafe App (TestFlight)

# Manual only for now (mirrors build-ios-customer.yml) - this cannot succeed
# until the app.kaffeekarte.cafe record exists in App Store Connect. Reuses
# the same account-level secrets as the customer app workflow (Apple
# Developer Program membership, App Store Connect API key, fastlane match
# cert repo). Switch to push-triggered once proven manually.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which deployed web app to point the build at"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/cafe-native
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_KEY"
          test -n "$MATCH_GIT_URL"
          test -n "$MATCH_PASSWORD"
          test -n "$MATCH_GIT_BASIC_AUTHORIZATION"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/cafe-native/package.json

      - name: Install web-app-level dependencies
        working-directory: .
        run: pnpm install --filter kaffeekarte-cafe-native

      - name: Sync Capacitor (copies web config into the native project)
        env:
          CAP_SERVER_URL: ${{ inputs.target == 'prod' && 'https://kaffeekarte.app' || 'https://staging.kaffeekarte.app' }}
        run: pnpm exec cap sync ios

      - name: Set up Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane

      - name: Build and upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: fastlane beta
