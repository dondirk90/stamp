name: Build Android Customer App (Play internal testing)

# Manual only for now (Phase A proof-of-concept, see native-apps plan) - needs
# an upload keystore, Google Play App Signing enrolled, and a Play Console
# service-account key before this can succeed. Switch to push-triggered once
# proven manually.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which deployed web app to point the build at"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer-native
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$PLAY_JSON_KEY"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/customer-native/package.json

      - name: Install web-app-level dependencies
        working-directory: .
        run: pnpm install --filter kaffeekarte-customer-native

      - name: Sync Capacitor (copies web config into the native project)
        env:
          CAP_SERVER_URL: ${{ inputs.target == 'prod' && 'https://kaffeekarte.app' || 'https://staging.kaffeekarte.app' }}
        run: pnpm exec cap sync android

      # gradlew was committed from a Windows machine without the executable
      # bit set (git tracked it as 100644), so fastlane's `gradle` action
      # failed with "Permission denied" before ever reaching Gradle itself.
      # Fixed in the repo now too, but this is a cheap belt-and-suspenders
      # guard against it silently regressing again.
      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          # Capacitor 7's cap sync generates capacitor.build.gradle with
          # sourceCompatibility/targetCompatibility = JavaVersion.VERSION_21
          # - JDK 17 can't compile against a release it doesn't know about
          # ("invalid source release: 21").
          java-version: "21"

      - name: Set up Ruby (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Fastlane
        run: gem install fastlane

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks

      - name: Decode Play Console service-account key
        env:
          PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
        run: echo "$PLAY_JSON_KEY" > play-service-account.json

      - name: Build and upload to Play internal testing
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/customer-native/android/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON_KEY_PATH: ${{ github.workspace }}/apps/customer-native/play-service-account.json
        run: fastlane android beta

      # Play Console's testing tracks have their own tester/device
      # requirements, separate from the app's actual minSdkVersion - this
      # signed .apk sideloads directly onto any device new enough to run the
      # app (Android 6.0+), no Play Console involved.
      - name: Upload signed APK for direct sideload
        uses: actions/upload-artifact@v4
        with:
          name: kaffeekarte-customer-${{ inputs.target }}.apk
          path: apps/customer-native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
