name: Deploy Staging

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          STAMP_SSH_HOST: ${{ secrets.STAMP_SSH_HOST }}
          STAMP_SSH_USER: ${{ secrets.STAMP_SSH_USER }}
          STAMP_SSH_KEY: ${{ secrets.STAMP_SSH_KEY }}
          STAGING_APPS_BASE_URL: ${{ secrets.STAGING_APPS_BASE_URL }}
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADMIN_BASIC_USER: ${{ secrets.ADMIN_BASIC_USER }}
          ADMIN_BASIC_HASH: ${{ secrets.ADMIN_BASIC_HASH }}
        run: |
          test -n "$STAMP_SSH_HOST"
          test -n "$STAMP_SSH_USER"
          test -n "$STAMP_SSH_KEY"
          test -n "$STAGING_APPS_BASE_URL"
          test -n "$STAGING_DOMAIN"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$OAUTH_STATE_SECRET"
          test -n "$ADMIN_TOKEN"
          test -n "$ADMIN_BASIC_USER"
          test -n "$ADMIN_BASIC_HASH"

      - name: Create deployment archive
        run: |
          mkdir -p .deploy
          tar \
            --exclude-vcs \
            --exclude='.github' \
            --exclude='.deploy' \
            --exclude='stamp-cafe-os' \
            --exclude='stamp-coffee-guide' \
            --exclude='node_modules' \
            --exclude='api/.api.*.log' \
            --exclude='apps/.apps-server.*.log' \
            --exclude='apps/customer-native' \
            --exclude='apps/cafe-native' \
            -czf .deploy/stamp-staging.tgz .

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAMP_SSH_HOST }}
          username: ${{ secrets.STAMP_SSH_USER }}
          key: ${{ secrets.STAMP_SSH_KEY }}
          port: ${{ secrets.STAMP_SSH_PORT || '22' }}
          source: ".deploy/stamp-staging.tgz"
          target: "/tmp"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAMP_SSH_HOST }}
          username: ${{ secrets.STAMP_SSH_USER }}
          key: ${{ secrets.STAMP_SSH_KEY }}
          port: ${{ secrets.STAMP_SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/stamp"
            ARCHIVE="$(find /tmp -type f -name 'stamp-staging.tgz' | head -n 1)"

            test -n "$ARCHIVE"

            mkdir -p "$APP_DIR"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 \
              ! -name '.env.staging' \
              ! -name '.env.prod' \
              -exec rm -rf {} +

            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            rm -f "$ARCHIVE"

            cat > "$APP_DIR/.env.staging" << 'EOF'
            STAGING_APPS_PORT=${{ secrets.STAGING_APPS_PORT || '8081' }}
            STAGING_APPS_BASE_URL=${{ secrets.STAGING_APPS_BASE_URL }}
            STAGING_DOMAIN=${{ secrets.STAGING_DOMAIN }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_SECURE=${{ secrets.EMAIL_SECURE }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            OAUTH_STATE_SECRET=${{ secrets.OAUTH_STATE_SECRET }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
            APPLE_SERVICES_ID=${{ secrets.APPLE_SERVICES_ID }}
            APPLE_KEY_ID=${{ secrets.APPLE_KEY_ID }}
            APPLE_PRIVATE_KEY_BASE64=${{ secrets.APPLE_PRIVATE_KEY_BASE64 }}
            APPLE_PASS_CERT_BASE64=${{ secrets.APPLE_PASS_CERT_BASE64 }}
            APPLE_PASS_KEY_BASE64=${{ secrets.APPLE_PASS_KEY_BASE64 }}
            APPLE_PASS_KEY_PASSPHRASE=${{ secrets.APPLE_PASS_KEY_PASSPHRASE }}
            APPLE_WWDR_CERT_BASE64=${{ secrets.APPLE_WWDR_CERT_BASE64 }}
            ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
            ADMIN_BASIC_USER=${{ secrets.ADMIN_BASIC_USER }}
            ADMIN_BASIC_HASH='${{ secrets.ADMIN_BASIC_HASH }}'
            EOF

            cd "$APP_DIR"
            docker compose -p stamp-staging -f infra/docker/docker-compose.staging.yml --env-file .env.staging up -d --build
            # `up -d` only recreates a container when the *service definition*
            # changes (image, env, etc.) - caddy's Caddyfile is a bind-mounted
            # file, so editing it is invisible to that check and the running
            # process keeps serving its old, already-loaded config until told
            # otherwise. `caddy reload` (the zero-downtime signal) didn't
            # reliably pick up the new config here, so force a full restart
            # instead - a couple seconds of caddy downtime is fine for this
            # traffic level, and it's guaranteed to pick up the fresh file.
            docker compose -p stamp-staging -f infra/docker/docker-compose.staging.yml --env-file .env.staging restart caddy
            for i in $(seq 1 30); do
              if curl --fail --silent --show-error "http://127.0.0.1:${{ secrets.STAGING_APPS_PORT || '8081' }}/api/health" >/dev/null; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Staging healthcheck failed after retries"
                exit 1
              fi
              sleep 2
            done

            echo "Staging deployed to https://${{ secrets.STAGING_DOMAIN }}"
