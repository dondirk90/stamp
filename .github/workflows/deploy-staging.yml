name: Deploy (staging)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.STAMP_SSH_HOST != '' && secrets.STAMP_SSH_USER != '' && secrets.STAMP_SSH_KEY != '' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAMP_SSH_HOST }}
          username: ${{ secrets.STAMP_SSH_USER }}
          key: ${{ secrets.STAMP_SSH_KEY }}
          port: ${{ secrets.STAMP_SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/stamp"
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R "$USER":"$USER" "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main

            cat > .env.staging << 'EOF'
            STAGING_APPS_PORT=${{ secrets.STAGING_APPS_PORT || '8081' }}
            STAGING_APPS_BASE_URL=${{ secrets.STAGING_APPS_BASE_URL || 'http://localhost:8081' }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_SECURE=${{ secrets.EMAIL_SECURE }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EOF

            docker compose -p stamp-staging -f infra/docker/docker-compose.staging.yml --env-file .env.staging up -d --build

            echo "Staging deployed. Apps: http://<server-ip>:${{ secrets.STAGING_APPS_PORT || '8081' }}"
