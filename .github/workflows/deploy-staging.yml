name: Deploy Staging

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.STAMP_SSH_HOST != '' && secrets.STAMP_SSH_USER != '' && secrets.STAMP_SSH_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          tar \
            --exclude-vcs \
            --exclude='.github' \
            --exclude='stamp-cafe-os' \
            --exclude='stamp-coffee-guide' \
            --exclude='node_modules' \
            --exclude='api/.api.*.log' \
            --exclude='apps/.apps-server.*.log' \
            -czf stamp-staging.tgz .

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAMP_SSH_HOST }}
          username: ${{ secrets.STAMP_SSH_USER }}
          key: ${{ secrets.STAMP_SSH_KEY }}
          port: ${{ secrets.STAMP_SSH_PORT || '22' }}
          source: "stamp-staging.tgz"
          target: "/tmp"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAMP_SSH_HOST }}
          username: ${{ secrets.STAMP_SSH_USER }}
          key: ${{ secrets.STAMP_SSH_KEY }}
          port: ${{ secrets.STAMP_SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/stamp"
            ARCHIVE="/tmp/stamp-staging.tgz"

            mkdir -p "$APP_DIR"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 \
              ! -name '.env.staging' \
              ! -name '.env.prod' \
              -exec rm -rf {} +

            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            rm -f "$ARCHIVE"

            cat > "$APP_DIR/.env.staging" << 'EOF'
            STAGING_APPS_PORT=${{ secrets.STAGING_APPS_PORT || '8081' }}
            STAGING_APPS_BASE_URL=${{ secrets.STAGING_APPS_BASE_URL }}
            STAGING_DOMAIN=${{ secrets.STAGING_DOMAIN }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_SECURE=${{ secrets.EMAIL_SECURE }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EOF

            cd "$APP_DIR"
            docker compose -p stamp-staging -f infra/docker/docker-compose.staging.yml --env-file .env.staging up -d --build

            echo "Staging deployed to https://${{ secrets.STAGING_DOMAIN }}"
