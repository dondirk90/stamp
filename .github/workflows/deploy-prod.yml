name: Deploy (prod)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.STAMP_SSH_HOST != '' && secrets.STAMP_SSH_USER != '' && secrets.STAMP_SSH_KEY != '' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAMP_SSH_HOST }}
          username: ${{ secrets.STAMP_SSH_USER }}
          key: ${{ secrets.STAMP_SSH_KEY }}
          port: ${{ secrets.STAMP_SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/stamp"
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown -R "$USER":"$USER" "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all --prune

            # Deploy the exact tag (if present), otherwise main
            if [ "${{ github.ref_type }}" = "tag" ]; then
              git checkout -f "${{ github.ref_name }}"
            else
              git checkout main
              git reset --hard origin/main
            fi

            cat > .env.prod << 'EOF'
            PROD_APPS_PORT=${{ secrets.PROD_APPS_PORT || '8080' }}
            PROD_APPS_BASE_URL=${{ secrets.PROD_APPS_BASE_URL || 'http://localhost:8080' }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_SECURE=${{ secrets.EMAIL_SECURE }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EOF

            # Ensure DB is up, then run migrations, then bring up the stack
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d --build db
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod run --rm migrate
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d --build api apps

            echo "Prod deployed. Apps: http://<server-ip>:${{ secrets.PROD_APPS_PORT || '8080' }}"
