name: Deploy Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PROD_APPS_BASE_URL: ${{ secrets.PROD_APPS_BASE_URL }}
          PROD_DOMAIN: ${{ secrets.PROD_DOMAIN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_SECURE: ${{ secrets.EMAIL_SECURE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADMIN_BASIC_USER: ${{ secrets.ADMIN_BASIC_USER }}
          ADMIN_BASIC_HASH: ${{ secrets.ADMIN_BASIC_HASH }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          test -n "$PROD_APPS_BASE_URL"
          test -n "$PROD_DOMAIN"
          test -n "$POSTGRES_USER"
          test -n "$POSTGRES_PASSWORD"
          test -n "$POSTGRES_DB"
          test -n "$DATABASE_URL"
          test -n "$EMAIL_HOST"
          test -n "$EMAIL_PORT"
          test -n "$EMAIL_SECURE"
          test -n "$EMAIL_USER"
          test -n "$EMAIL_PASS"
          test -n "$EMAIL_FROM"
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$OAUTH_STATE_SECRET"
          test -n "$ADMIN_TOKEN"
          test -n "$ADMIN_BASIC_USER"
          test -n "$ADMIN_BASIC_HASH"

      - name: Create deployment archive
        run: |
          mkdir -p .deploy
          tar \
            --exclude-vcs \
            --exclude='.github' \
            --exclude='.deploy' \
            --exclude='stamp-cafe-os' \
            --exclude='stamp-coffee-guide' \
            --exclude='node_modules' \
            --exclude='api/.api.*.log' \
            --exclude='apps/.apps-server.*.log' \
            -czf .deploy/stamp-prod.tgz .

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: ".deploy/stamp-prod.tgz"
          target: "/tmp"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/stamp"
            ARCHIVE="$(find /tmp -type f -name 'stamp-prod.tgz' | head -n 1)"

            test -n "$ARCHIVE"

            mkdir -p "$APP_DIR"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 \
              ! -name '.env.staging' \
              ! -name '.env.prod' \
              -exec rm -rf {} +

            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            rm -f "$ARCHIVE"

            cat > "$APP_DIR/.env.prod" << 'EOF'
            PROD_APPS_PORT=${{ secrets.PROD_APPS_PORT || '8080' }}
            PROD_APPS_BASE_URL=${{ secrets.PROD_APPS_BASE_URL }}
            PROD_DOMAIN=${{ secrets.PROD_DOMAIN }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_SECURE=${{ secrets.EMAIL_SECURE }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            OAUTH_STATE_SECRET=${{ secrets.OAUTH_STATE_SECRET }}
            ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }}
            ADMIN_BASIC_USER=${{ secrets.ADMIN_BASIC_USER }}
            ADMIN_BASIC_HASH='${{ secrets.ADMIN_BASIC_HASH }}'
            EOF

            cd "$APP_DIR"
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d --build db
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod run --rm migrate
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod exec -T db \
              psql -U "${{ secrets.POSTGRES_USER }}" -d "${{ secrets.POSTGRES_DB }}" -v ON_ERROR_STOP=1 -c \
              "SELECT to_regclass('public.customer_oauth_identities') AS customer_oauth_identities, to_regclass('public.customer_auth_grants') AS customer_auth_grants;"
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod exec -T db \
              psql -U "${{ secrets.POSTGRES_USER }}" -d "${{ secrets.POSTGRES_DB }}" -tA -v ON_ERROR_STOP=1 -c \
              "SELECT CASE WHEN to_regclass('public.customer_oauth_identities') IS NOT NULL AND to_regclass('public.customer_auth_grants') IS NOT NULL THEN 'ok' ELSE 'missing' END;" \
              | grep -qx 'ok'
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d --build api apps caddy

            echo "Production deployed to https://${{ secrets.PROD_DOMAIN }}"
