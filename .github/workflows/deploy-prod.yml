name: Deploy Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate required secrets
        env:
          STAMP_SSH_HOST: ${{ secrets.STAMP_SSH_HOST }}
          STAMP_SSH_USER: ${{ secrets.STAMP_SSH_USER }}
          STAMP_SSH_KEY: ${{ secrets.STAMP_SSH_KEY }}
          PROD_APPS_BASE_URL: ${{ secrets.PROD_APPS_BASE_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$STAMP_SSH_HOST"
          test -n "$STAMP_SSH_USER"
          test -n "$STAMP_SSH_KEY"
          test -n "$PROD_APPS_BASE_URL"
          test -n "$POSTGRES_USER"
          test -n "$POSTGRES_PASSWORD"
          test -n "$POSTGRES_DB"
          test -n "$DATABASE_URL"

      - name: Create deployment archive
        run: |
          tar \
            --exclude-vcs \
            --exclude='.github' \
            --exclude='stamp-cafe-os' \
            --exclude='stamp-coffee-guide' \
            --exclude='node_modules' \
            --exclude='api/.api.*.log' \
            --exclude='apps/.apps-server.*.log' \
            -czf stamp-prod.tgz .

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAMP_SSH_HOST }}
          username: ${{ secrets.STAMP_SSH_USER }}
          key: ${{ secrets.STAMP_SSH_KEY }}
          port: ${{ secrets.STAMP_SSH_PORT || '22' }}
          source: "stamp-prod.tgz"
          target: "/tmp"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAMP_SSH_HOST }}
          username: ${{ secrets.STAMP_SSH_USER }}
          key: ${{ secrets.STAMP_SSH_KEY }}
          port: ${{ secrets.STAMP_SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="/opt/stamp"
            ARCHIVE="/tmp/stamp-prod.tgz"

            mkdir -p "$APP_DIR"
            find "$APP_DIR" -mindepth 1 -maxdepth 1 \
              ! -name '.env.staging' \
              ! -name '.env.prod' \
              -exec rm -rf {} +

            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            rm -f "$ARCHIVE"

            cat > "$APP_DIR/.env.prod" << 'EOF'
            PROD_APPS_PORT=${{ secrets.PROD_APPS_PORT || '8080' }}
            PROD_APPS_BASE_URL=${{ secrets.PROD_APPS_BASE_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_SECURE=${{ secrets.EMAIL_SECURE }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            EOF

            cd "$APP_DIR"
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d --build db
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod run --rm migrate
            docker compose -p stamp-prod -f infra/docker/docker-compose.prod.yml --env-file .env.prod up -d --build api apps

            echo "Production deployed."
