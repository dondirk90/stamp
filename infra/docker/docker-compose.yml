version: "3.9"

services:
  db:
    image: postgres:16
    container_name: stamp_postgres
    restart: always
    environment:
      POSTGRES_USER: stempel
      POSTGRES_PASSWORD: stempel
      POSTGRES_DB: stempel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: stamp_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
