version: "3.9"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - apps
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_BASIC_USER: ${ADMIN_BASIC_USER:-}
      ADMIN_BASIC_HASH: ${ADMIN_BASIC_HASH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config

  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # SQLite mode: omit DATABASE_URL; data persists via volume
      APPS_BASE_URL: ${STAGING_APPS_BASE_URL:-http://localhost:8081}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_SECURE: ${EMAIL_SECURE:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_BASE64: ${APPLE_PRIVATE_KEY_BASE64:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - staging_data:/data

  apps:
    build:
      context: ../../apps
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 8080
      API_HOST: api
      API_PORT: 3000
    ports:
      - "${STAGING_APPS_PORT:-8081}:8080"

volumes:
  staging_data:
  staging_caddy_data:
  staging_caddy_config:
