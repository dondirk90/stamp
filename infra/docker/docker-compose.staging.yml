version: "3.9"

services:
  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # SQLite mode: omit DATABASE_URL; data persists via volume
      APPS_BASE_URL: ${STAGING_APPS_BASE_URL:-http://localhost:8081}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_SECURE: ${EMAIL_SECURE:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    volumes:
      - staging_data:/data

  apps:
    build:
      context: ../../apps
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 8080
      API_HOST: api
      API_PORT: 3000
    ports:
      - "${STAGING_APPS_PORT:-8081}:8080"

volumes:
  staging_data:
