version: "3.9"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - apps
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_BASIC_USER: ${ADMIN_BASIC_USER:-}
      ADMIN_BASIC_HASH: ${ADMIN_BASIC_HASH:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - prod_caddy_data:/data
      - prod_caddy_config:/config

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../../api
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    command: ["node", "migrate.cjs"]

  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      APPS_BASE_URL: ${PROD_APPS_BASE_URL:-http://localhost:8080}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_SECURE: ${EMAIL_SECURE:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_SERVICES_ID: ${APPLE_SERVICES_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_BASE64: ${APPLE_PRIVATE_KEY_BASE64:-}
      APPLE_PASS_CERT_BASE64: ${APPLE_PASS_CERT_BASE64:-}
      APPLE_PASS_KEY_BASE64: ${APPLE_PASS_KEY_BASE64:-}
      APPLE_PASS_KEY_PASSPHRASE: ${APPLE_PASS_KEY_PASSPHRASE:-}
      APPLE_WWDR_CERT_BASE64: ${APPLE_WWDR_CERT_BASE64:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}

  apps:
    build:
      context: ../../apps
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 8080
      API_HOST: api
      API_PORT: 3000
    ports:
      - "${PROD_APPS_PORT:-8080}:8080"

volumes:
  prod_pgdata:
  prod_caddy_data:
  prod_caddy_config:
