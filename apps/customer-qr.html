<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Customer QR — Stamp</title>
    <style>
      body {
        font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
        background: #f6f7fb;
        margin: 0;
        padding: 20px;
      }
      .card {
        max-width: 420px;
        margin: 24px auto;
        background: #fff;
        padding: 18px;
        border-radius: 12px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 18px;
        margin-bottom: 8px;
        color: #1e293b;
      }
      label {
        display: block;
        font-size: 13px;
        color: #556;
      }
      input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-family: monospace;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: 0;
        background: #1976d2;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #64748b;
      }
      .qr-wrap {
        text-align: center;
        margin-top: 18px;
      }
      canvas {
        width: 260px;
        height: 260px;
      }
      .small {
        font-size: 13px;
        color: #6b7280;
        margin-top: 10px;
      }
      /* hide control buttons when not needed (user requested cleaner UI) */
      #gen,
      #copy,
      #download,
      #openScanner {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div
        style="
          background: #fee2e2;
          color: #991b1b;
          padding: 12px;
          border-radius: 8px;
          margin: 12px;
          max-width: 720px;
          margin-left: auto;
          margin-right: auto;
          text-align: center;
          font-weight: 700;
        "
      >
        JavaScript ist deaktiviert oder wird blockiert. Bitte aktiviere
        JavaScript in deinem Browser oder deaktiviere Erweiterungen, die Skripte
        blockieren.
            <title>Customer — Stamp</title>
            <link rel="stylesheet" href="/theme.css" />
            <style>
              body {
                padding: var(--space-5);
              }

              .shell {
                max-width: 980px;
                margin: 0 auto;
              }

              .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-3);
                margin-bottom: var(--space-4);
              }

              .brand {
                display: flex;
                flex-direction: column;
                gap: 2px;
              }

              .brand h1 {
                margin: 0;
                font-size: 18px;
              }

              .brand .subtitle {
                font-size: 13px;
              }

              .grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: var(--space-4);
              }

              @media (min-width: 860px) {
                .grid {
                  grid-template-columns: 360px 1fr;
                  align-items: start;
                }
              }

              .panel {
                padding: var(--space-5);
              }

              .seg {
                display: inline-flex;
                border: 1px solid var(--border);
                background: var(--surface-muted);
                border-radius: 999px;
                padding: 4px;
                gap: 4px;
              }

              .seg button {
                border-radius: 999px;
                padding: 8px 12px;
                font-weight: 800;
                background: transparent !important;
                color: var(--text) !important;
                border: none;
              }

              .seg button.active {
                background: var(--surface) !important;
                border: 1px solid var(--border);
              }

              .actions {
                display: flex;
                gap: var(--space-2);
                margin-top: var(--space-3);
              }

              .actions button {
                flex: 1;
              }

              .navRow {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: var(--space-3);
                flex-wrap: wrap;
              }

              .navRow select {
                min-width: 260px;
              }

              /* Flip card */
              .flip {
                perspective: 1200px;
              }
              .flipInner {
                position: relative;
                width: 100%;
                min-height: 340px;
                transition: transform 360ms ease;
                transform-style: preserve-3d;
              }
              .flip.flipped .flipInner {
                transform: rotateY(180deg);
              }
              .face {
                position: absolute;
                inset: 0;
                backface-visibility: hidden;
                border-radius: var(--radius);
                border: 1px solid var(--border);
                background: var(--surface);
                box-shadow: var(--shadow-lg);
                padding: var(--space-5);
                display: flex;
                flex-direction: column;
                gap: var(--space-3);
              }
              .back {
                transform: rotateY(180deg);
              }

              .cardHead {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: var(--space-3);
              }

              .cardTitle {
                font-size: 18px;
                font-weight: 900;
                color: var(--brand);
                margin: 0;
              }

              .stampGrid {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 10px;
                padding: 6px;
                border-radius: var(--radius-sm);
                background: var(--surface-muted);
                border: 1px solid var(--border);
              }

              .stamp {
                aspect-ratio: 1 / 1;
                border-radius: 999px;
                border: 2px dashed var(--border);
                background: var(--surface);
                display: grid;
                place-items: center;
                font-weight: 900;
                color: var(--text-muted);
                user-select: none;
              }

              .stamp.filled {
                border-style: solid;
                border-color: var(--brand);
                background: var(--brand-50);
                color: var(--brand);
              }

              .qrBox {
                display: grid;
                place-items: center;
                flex: 1;
                min-height: 220px;
                border-radius: var(--radius-sm);
                border: 1px dashed var(--border);
                background: var(--surface-muted);
              }

              #qrCanvas {
                width: 260px;
                height: 260px;
              }

              .hint {
                font-size: 13px;
                color: var(--text-muted);
              }
            </style>
      // Minimal early indicator to show the inline script executed
      try {
            <noscript>
              <div class="container">
                <div class="notice danger">
                  JavaScript ist deaktiviert. Bitte aktiviere JavaScript.
                </div>
              </div>
            </noscript>

            <div class="shell">
              <div class="topbar">
                <div class="brand">
                  <h1>Deine Stempelkarte</h1>
                  <div class="subtitle" id="buildBadge">build</div>
                </div>
                <div class="row">
                  <span class="badge" id="sessionBadge">Nicht eingeloggt</span>
                  <button class="btn secondary" id="logoutBtn" style="display: none">
                    Logout
                  </button>
                </div>
              </div>

              <div class="grid">
                <div class="card panel" id="authPanel">
                  <div class="row" style="justify-content: space-between">
                    <h2 style="margin: 0">Account</h2>
                    <div class="seg" role="tablist" aria-label="Auth Mode">
                      <button id="modeRegister" class="active" type="button">
                        Neu
                      </button>
                      <button id="modeLogin" type="button">Login</button>
                    </div>
                  </div>

                  <div class="stack" style="margin-top: var(--space-4)">
                    <div id="registerFields" class="stack">
                      <div class="stack" style="gap: 6px">
                        <label for="username">Username</label>
                        <input id="username" type="text" autocomplete="nickname" />
                      </div>
                    </div>
                    <div class="stack" style="gap: 6px">
                      <label for="email">E-Mail</label>
                      <input id="email" type="text" autocomplete="email" />
                    </div>

                    <div class="actions">
                      <button class="btn primary" id="authSubmit" type="button">
                        Account erstellen
                      </button>
                    </div>

                    <div id="authMsg" class="notice" style="display: none"></div>
                    <div class="hint">
                      Kein Wallet eintippen. Im Hintergrund wird automatisch eins
                      erstellt.
                    </div>
                  </div>
                </div>

                <div class="stack" id="mainPanel" style="display: none">
                  <div class="card panel">
                    <div class="navRow">
                      <div class="stack" style="gap: 6px">
                        <div class="badge" id="welcomeBadge">Willkommen</div>
                        <div class="muted" id="addressLine"></div>
                      </div>

                      <div class="row wrap">
                        <label for="cafeSelect" style="font-weight: 800">
                          Café
                        </label>
                        <select id="cafeSelect"></select>
                      </div>
                    </div>
                  </div>

                  <div class="flip" id="flipCard" aria-label="Stempelkarte">
                    <div class="flipInner">
                      <div class="face front">
                        <div class="cardHead">
                          <h3 class="cardTitle" id="cafeTitle">Wähle ein Café</h3>
                          <span class="badge" id="stampCountBadge">0 / 10</span>
                        </div>
                        <div class="stampGrid" id="stampGrid"></div>
                        <div class="hint">
                          Tippe auf die Karte, um den QR-Code zu zeigen.
                        </div>
                      </div>
                      <div class="face back">
                        <div class="cardHead">
                          <h3 class="cardTitle">QR für den Barista</h3>
                          <span class="badge" id="qrCafeBadge">Café</span>
                        </div>
                        <div class="qrBox">
                          <canvas id="qrCanvas"></canvas>
                        </div>
                        <div class="hint" id="qrHint">
                          Dieser QR ist an das ausgewählte Café gebunden.
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <script src="/vendor/qrcode.min.js"></script>
            <script src="/customer-qr.js"></script>
            genBtn.style.opacity = "";
            openScannerBtn.disabled = false;
            openScannerBtn.style.opacity = "";
          }
        } catch (e) {}
        const url = buildUrl(addr);
        // Use qrcode lib to draw to canvas
        try {
          await QRCode.toCanvas(canvas, url, {
            width: 300,
            margin: 2,
            color: { dark: "#111111", light: "#ffffff" },
          });
          // Show the encoded payload (address) rather than a host-specific link
          linkBox.innerHTML = `<div>Address: <code>${url}</code></div>`;
          // store for convenience
          localStorage.setItem("customer_addr", addr);
          localStorage.setItem("customer_name", nameEl.value || "");
          // after rendering, ensure SSE is listening for confirmations for this addr
          try {
            startSSEFor(addr);
          } catch (e) {}
        } catch (err) {
          console.error(err);
          alert("QR render failed: " + err.message);
        }
      }

      if (genBtn) genBtn.addEventListener("click", renderQR);

      if (copyBtn)
        copyBtn.addEventListener("click", async () => {
          const addr = addrEl.value.trim();
          if (!addr) return;
          try {
            await navigator.clipboard.writeText(addr);
            copyBtn.textContent = "Copied";
            setTimeout(() => {
              if (copyBtn) copyBtn.textContent = "Copy";
            }, 900);
          } catch (e) {
            alert("Clipboard failed");
          }
        });

      if (downloadBtn)
        downloadBtn.addEventListener("click", () => {
          try {
            const data = canvas.toDataURL("image/png");
            const a = document.createElement("a");
            a.href = data;
            a.download = (addrEl.value || "customer") + "-qr.png";
            document.body.appendChild(a);
            a.click();
            a.remove();
          } catch (e) {
            alert("Download failed: " + e.message);
          }
        });

      if (openScannerBtn)
        openScannerBtn.addEventListener("click", () => {
          const addr = addrEl.value.trim();
          if (!addr) return;
          const url = `${
            window.location.origin
          }/cafe-issuer-web.html?customer=${encodeURIComponent(addr)}`;
          window.location.href = url;
        });

      // Show stamps button — fetch current stamp count (with graceful fallback)
      if (showStampsBtn) {
        showStampsBtn.addEventListener("click", async () => {
          try {
            stampsPanel.style.display = "";
            stampsPanel.textContent = "Lade...";
            const host = window.location.hostname;
            const proto = window.location.protocol;
            const addr = addrEl.value.trim();
            if (!/^0x[0-9a-fA-F]{40}$/.test(addr)) {
              stampsPanel.textContent = "Bitte gib eine gültige Adresse ein.";
              return;
            }
            const resp = await fetch(
              `${proto}//${host}:3000/stamps/${addr}?fallback=1`
            );
            if (!resp.ok) {
              stampsPanel.textContent = `Fehler: ${resp.status}`;
              return;
            }
            const j = await resp.json();
            stampsPanel.innerHTML =
              `Stempel beim Café <code>${j.cafe || "—"}</code>: <strong>${
                j.stamps
              }</strong>` +
              (j.error
                ? `<div style="color:#c00;font-size:12px">${j.error}</div>`
                : "");
          } catch (e) {
            stampsPanel.textContent =
              "Abfrage fehlgeschlagen: " + (e && e.message);
          }
        });
      }

      // Autogenerate from last saved
      window.tryAutoRender = function tryAutoRender() {
        try {
          const last = (function () {
            try {
              const s = localStorage.getItem("customer_addr");
              if (!s) return null;
              try {
                const p = JSON.parse(s);
                if (typeof p === "string") return p;
              } catch (e) {}
              return s;
            } catch (e) {
              return null;
            }
          })();
          if (last && !addrEl.value) addrEl.value = last;
          if (addrEl.value && typeof QRCode !== "undefined") {
            dbgBanner("[auto] triggering renderQR for " + addrEl.value);
            renderQR();
          } else if (addrEl.value) {
            dbgBanner("[auto] address present but QR library not loaded yet");
          }
        } catch (e) {
          dbgBanner("[auto] error " + (e && e.message));
        }
      };
      // call initially
      tryAutoRender();

      // --- SSE: listen for stamp confirmations for this customer ---
      let sse;
      // success area (hidden until needed)
      const successEl = document.createElement("div");
      successEl.style.display = "none";
      successEl.style.marginTop = "12px";
      successEl.style.textAlign = "center";
      successEl.innerHTML = `
        <div id="successBox" style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <svg width="96" height="96" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" fill="#16a34a" />
            <path d="M7 13l3 3 7-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          <div id="successMsg" style="font-weight:800;color:#064e3b;font-size:16px">Erfolgreich!</div>
          <div id="successDetail" style="font-size:13px;color:#064e3b"></div>
          <button id="newQrBtn" style="margin-top:8px;padding:8px 14px;border-radius:8px;background:#1976d2;color:#fff;border:0;cursor:pointer">Neuen QR erstellen</button>
        </div>
      `;
      document.querySelector(".card").appendChild(successEl);

      function showSuccess(txhash, addr) {
        // hide QR and controls
        canvas.style.display = "none";
        linkBox.innerHTML = "";
        if (copyBtn) {
          copyBtn.disabled = true;
          copyBtn.style.opacity = "0.6";
        }
        if (downloadBtn) {
          downloadBtn.disabled = true;
          downloadBtn.style.opacity = "0.6";
        }
        if (genBtn) {
          genBtn.disabled = true;
          genBtn.style.opacity = "0.6";
        }
        if (openScannerBtn) {
          openScannerBtn.disabled = true;
          openScannerBtn.style.opacity = "0.6";
        }

        // show success box
        successEl.style.display = "block";
        const detail = document.getElementById("successDetail");
        detail.innerHTML = `TX: <a href="#" target="_blank" style="color:#064e3b">${txhash.slice(
          0,
          10
        )}...</a>`;

        // try to fetch updated stamp count
        (async () => {
          try {
            const host = window.location.hostname;
            const proto = window.location.protocol;
            const resp = await fetch(`${proto}//${host}:3000/stamps/${addr}`);
            if (resp.ok) {
              const j = await resp.json();
              detail.innerHTML = `TX: ${txhash.slice(0, 10)}... — Stempel: ${
                j.stamps
              }`;
            }
          } catch (e) {}
        })();

        // allow user to create new QR
        const newBtn = document.getElementById("newQrBtn");
        if (newBtn)
          newBtn.addEventListener("click", () => {
            // reset UI
            successEl.style.display = "none";
            canvas.style.display = "";
            if (copyBtn) {
              copyBtn.disabled = false;
              copyBtn.style.opacity = "";
            }
            if (downloadBtn) {
              downloadBtn.disabled = false;
              downloadBtn.style.opacity = "";
            }
            if (genBtn) {
              genBtn.disabled = false;
              genBtn.style.opacity = "";
            }
            if (openScannerBtn) {
              openScannerBtn.disabled = false;
              openScannerBtn.style.opacity = "";
            }
          });
      }

      function startSSEFor(addr) {
        stopSSE();
        try {
          console.log("[dbg] startSSEFor", addr);
          try {
            dbgBanner("[dbg] startSSEFor " + addr);
          } catch (e) {}
          const host = window.location.hostname;
          const proto = window.location.protocol;
          const apiUrl = `${proto}//${host}:3000/events/stream`;
          sse = new EventSource(apiUrl);
          sse.onmessage = (ev) => {
            try {
              const data = JSON.parse(ev.data);
              if (!data || !data.user) return;
              if (data.user.toLowerCase() === addr.toLowerCase()) {
                // show confirmation and replace QR with success box
                showSuccess(data.txhash, addr);
                // stop listening after first confirmation for this QR
                stopSSE();
              }
            } catch (e) {}
          };
          sse.onerror = () => {
            // try reconnect via browser EventSource default behavior
          };
        } catch (e) {
          console.warn("SSE start failed", e);
        }
      }

      function stopSSE() {
        if (sse) {
          try {
            sse.close();
          } catch (e) {}
          sse = null;
        }
      }

      // start SSE when we have an address
      (function initSSE() {
        const a = addrEl.value || localStorage.getItem("customer_addr");
        if (a && /^0x[0-9a-fA-F]{40}$/.test(a)) startSSEFor(a);
      })();

      // restart SSE when user changes address and generates a new QR
      if (genBtn)
        genBtn.addEventListener("click", () => {
          const a = addrEl.value.trim();
          if (/^0x[0-9a-fA-F]{40}$/.test(a)) startSSEFor(a);
        });
    </script>
    <!-- External diagnostic script: useful if inline scripts are blocked -->
    <script src="/customer-qr.js"></script>
  </body>
</html>
