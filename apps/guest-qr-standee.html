<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaffeekarte Aufsteller</title>
    <style>
      :root {
        --paper: #f7f4ef;
        --ink: #232323;
        --espresso: #4a3728;
        --espresso-deep: #2c1e15;
        --ink-soft: rgba(35, 35, 35, 0.55);
        --line: rgba(74, 55, 40, 0.16);
        --terracotta: #b96b52;
        --font-serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        --font-sans: "Geist", "Inter", "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(180deg, #f2ede5 0%, #e9e2d7 100%);
        color: var(--ink);
        font-family: var(--font-sans);
      }

      body {
        min-height: 100vh;
        padding: 28px;
      }

      .toolbar {
        max-width: 1080px;
        margin: 0 auto 18px;
        display: grid;
        grid-template-columns: 1.1fr 0.85fr 0.95fr auto;
        gap: 12px;
        align-items: end;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .field input {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
        border-radius: 16px;
        padding: 14px 16px;
        font-size: 15px;
        outline: none;
      }

      .toolbarActions {
        display: flex;
        gap: 10px;
      }

      .btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        min-height: 48px;
        padding: 0 22px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }

      .btn.primary {
        background: var(--espresso);
        color: #fffdfa;
      }

      .btn.secondary {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--line);
        color: var(--ink);
      }

      .help {
        max-width: 900px;
        margin: 0 auto 22px;
        font-size: 13px;
        color: var(--ink-soft);
        line-height: 1.5;
      }

      /* Einzelnes A5-Blatt fuer einen handelsueblichen Acryl-Tischaufsteller -
         kein Falten/Schneiden mehr noetig, ein Layout statt zwei Gesichter. */
      .sheet {
        width: 148mm;
        min-height: 210mm;
        margin: 0 auto;
        background: var(--paper);
        border-radius: 14px;
        box-shadow: 0 22px 42px rgba(42, 24, 14, 0.14);
        overflow: hidden;
        display: flex;
      }

      /* Durchgehende Kartenfarbe: die ganze Flaeche traegt die Cafe-Farbe
         (oder den Kaffeekarte-Espresso als Default). Vier Zonen von oben
         nach unten, bewusst in dieser Reihenfolge fuer den Blickverlauf an
         der Theke: Cafe-Identitaet -> Botschaft -> Belohnung direkt am CTA
         -> QR -> Kaffeekarte-Marke klein am Fuss. */
      .face {
        flex: 1;
        width: 100%;
        background: var(--cafe-block-bg, var(--espresso-deep));
        color: var(--cafe-block-fg, var(--paper));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 16mm 16mm 12mm;
        text-align: center;
      }

      /* Cafe-Logo oben links. Cafes ohne eigenes Logo bekommen stattdessen
         ihren Namen als schlichten Schriftzug an derselben Stelle - nie
         beides gleichzeitig, das waere wieder zu viel Information fuer eine
         einzige Ecke. */
      .cardTop {
        width: 100%;
        min-height: 10mm;
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }

      .cafeLogo {
        height: 10mm;
        max-width: 40mm;
        object-fit: contain;
        display: none;
      }

      .cafeNameFallback {
        font-size: 9pt;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .cafeNameFallback:empty {
        display: none;
      }

      /* Bewusst minimalistisch: ein Satz als Aufhaenger, dann die konkrete
         Belohnung direkt neben der Handlungsaufforderung (Belohnung und CTA
         sollen in einem Blick erfassbar sein, nicht getrennt), der QR-Code,
         ein kurzer Reibungs-Abbau-Hinweis - sonst nichts. */
      .cardCenter {
        display: grid;
        justify-items: center;
        gap: 4mm;
        max-width: 100mm;
      }

      .claim {
        font-family: var(--font-serif);
        font-size: 19pt;
        line-height: 1.15;
        letter-spacing: -0.01em;
      }

      .claimRule {
        width: 10mm;
        height: 0.7mm;
        border-radius: 1mm;
        background: var(--terracotta);
        margin-bottom: 1mm;
      }

      /* Belohnung + Aufforderung als ein CTA-Block direkt ueber dem QR - die
         Aufforderung allein traegt auch ohne hinterlegte Praemie. */
      .ctaBlock {
        display: grid;
        justify-items: center;
        gap: 1.2mm;
      }

      .qrLabel {
        font-size: 9pt;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.82;
      }

      /* Optionaler Praemien-Text pro Cafe (Toolbar-Feld / Cafe-Profil) -
         macht aus der Aufforderung ein konkretes Versprechen. Bleibt leer ->
         kein Platz verschwendet, kein erfundener Standardtext. */
      .qrReward {
        font-family: var(--font-serif);
        font-size: 14pt;
        line-height: 1.2;
      }

      .qrReward:empty {
        display: none;
      }

      .qrCard {
        background: #ffffff;
        border-radius: 4.5mm;
        padding: 4mm;
        box-shadow: 0 3mm 6mm rgba(0, 0, 0, 0.2);
        display: grid;
        place-items: center;
      }

      .qrCard img,
      .qrCard canvas {
        display: block;
        width: 40mm !important;
        height: 40mm !important;
      }

      .qrFallback {
        width: 40mm;
        font-size: 8px;
        color: var(--espresso-deep);
        text-align: center;
        line-height: 1.3;
      }

      /* Reibungs-Abbau: der eigentliche Vorteil gegenueber einer klassischen
         Stempelkarten-App ist "kein Download", das gehoert sichtbar direkt
         zur Handlung, nicht als Kleingedrucktes irgendwo. */
      .frictionNote {
        font-size: 7.8pt;
        font-weight: 600;
        letter-spacing: 0.05em;
        opacity: 0.72;
      }

      .cardBottom {
        display: flex;
        align-items: center;
        gap: 1.8mm;
      }

      .footerMark {
        width: 5mm;
        height: 5mm;
        object-fit: contain;
      }

      .wordmarkSmall {
        font-size: 7.4pt;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        opacity: 0.78;
      }

      @media print {
        @page {
          size: A5 portrait;
          margin: 0;
        }

        html,
        body {
          background: white;
        }

        body {
          padding: 0;
        }

        .toolbar,
        .help {
          display: none !important;
        }

        .sheet {
          width: 148mm;
          min-height: 210mm;
          margin: 0;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="field">
        <label for="urlInput">QR-Ziel (App Store auf iPhone, sonst Registrierung)</label>
        <input id="urlInput" type="text" />
      </div>
      <div class="field">
        <label for="cafeInput">Café-Name (optional)</label>
        <input id="cafeInput" type="text" placeholder="z. B. Café Impact" />
      </div>
      <div class="field">
        <label for="rewardInput">Prämie (optional)</label>
        <input id="rewardInput" type="text" placeholder="z. B. Gratis Kaffee ab 10 Stempeln" />
      </div>
      <div class="toolbarActions">
        <button class="btn secondary" type="button" id="updateBtn">Aktualisieren</button>
        <button class="btn primary" type="button" id="printBtn">Drucken</button>
      </div>
    </div>

    <div class="help">
      Auf A5 drucken (oder auf Pappe kaschieren) und in einen handelsüblichen
      Acryl-Tischaufsteller stecken.
    </div>

    <main class="sheet">
      <section class="face">
        <div class="cardTop">
          <img class="cafeLogo" data-cafe-logo alt="" />
          <div class="cafeNameFallback" data-cafe-name></div>
        </div>

        <div class="cardCenter">
          <div class="claim">Good coffee deserves better&nbsp;loyalty.</div>
          <div class="claimRule" aria-hidden="true"></div>

          <div class="ctaBlock">
            <div class="qrLabel">Scannen &amp; sichern</div>
            <div class="qrReward" data-reward-text></div>
          </div>

          <div class="qrCard" data-qr-target></div>
          <div class="frictionNote">Kein Download · 10 Sekunden</div>
        </div>

        <div class="cardBottom">
          <img class="footerMark" src="assets/app-icon-mark.png" alt="" />
          <div class="wordmarkSmall">Kaffeekarte</div>
        </div>
      </section>
    </main>

    <script src="vendor/qrcode.min.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var runtimeOrigin = /^https?:/i.test(window.location.protocol)
          ? window.location.origin
          : "https://kaffeekarte.app";
        // /get-app erkennt iPhone vs. Rest und leitet entsprechend weiter
        // (App Store bzw. Browser-Registrierung unter /wallet).
        var defaultUrl = runtimeOrigin + "/get-app";
        var urlInput = document.getElementById("urlInput");
        var cafeInput = document.getElementById("cafeInput");
        var rewardInput = document.getElementById("rewardInput");
        var updateBtn = document.getElementById("updateBtn");
        var printBtn = document.getElementById("printBtn");
        var qrTargets = Array.prototype.slice.call(document.querySelectorAll("[data-qr-target]"));
        var cafeLabels = Array.prototype.slice.call(document.querySelectorAll("[data-cafe-name]"));
        var cafeLogoTargets = Array.prototype.slice.call(document.querySelectorAll("[data-cafe-logo]"));
        var rewardLabels = Array.prototype.slice.call(document.querySelectorAll("[data-reward-text]"));

        function normalizeUrl(raw) {
          var value = String(raw || "").trim();
          if (!value) return defaultUrl;
          if (/^https?:\/\//i.test(value)) return value;
          if (value.charAt(0) === "/") return runtimeOrigin + value;
          return "https://" + value;
        }

        function updateHistory(url, cafe, reward) {
          if (!/^https?:/i.test(window.location.protocol)) return;
          var next = new URL(window.location.href);
          next.searchParams.set("url", url);
          if (cafe) next.searchParams.set("cafe", cafe);
          else next.searchParams.delete("cafe");
          if (reward) next.searchParams.set("reward", reward);
          else next.searchParams.delete("reward");
          window.history.replaceState({}, "", next.toString());
        }

        function showQrFallback(target) {
          target.innerHTML =
            '<div class="qrFallback">QR-Code konnte gerade nicht erzeugt werden.<br />Bitte Seite neu laden.</div>';
        }

        function renderQr(target, url) {
          target.innerHTML = "";
          // Vendor-Bundle ist node-qrcode (toDataURL), nicht qrcodejs.
          if (window.QRCode && typeof QRCode.toDataURL === "function") {
            // Promise zurueckgeben, damit render() und der Drucken-Button
            // wissen, wann das Bild wirklich im DOM haengt - sonst macht
            // window.print() einen Schnappschuss der noch leeren Karte.
            return QRCode.toDataURL(url, {
              width: 420,
              margin: 1,
              errorCorrectionLevel: "M",
              color: { dark: "#2c1e15", light: "#ffffff" },
            })
              .then(function (dataUrl) {
                target.innerHTML = "";
                var img = document.createElement("img");
                img.alt = "QR-Code zur Registrierung";
                img.src = dataUrl;
                target.appendChild(img);
              })
              .catch(function () {
                showQrFallback(target);
              });
          }
          showQrFallback(target);
          return Promise.resolve();
        }

        function render() {
          var finalUrl = normalizeUrl(urlInput.value);
          var cafeName = String(cafeInput.value || "").trim();
          var rewardText = String(rewardInput.value || "").trim();

          rewardLabels.forEach(function (label) {
            label.textContent = rewardText;
          });

          cafeLabels.forEach(function (label) {
            label.textContent = cafeName;
          });

          var qrPromises = qrTargets.map(function (target) {
            try {
              return renderQr(target, finalUrl);
            } catch (error) {
              target.innerHTML =
                '<div class="qrFallback">QR-Code konnte gerade nicht erzeugt werden.<br />Bitte Seite neu laden.</div>';
              return Promise.resolve();
            }
          });

          updateHistory(finalUrl, cafeName, rewardText);
          return Promise.all(qrPromises);
        }

        // Zeigt entweder das Cafe-Logo oder (Fallback) den Cafe-Namen oben
        // links - nie beides, sonst wirkt die Ecke ueberladen.
        function setCafeLogo(url) {
          cafeLogoTargets.forEach(function (img) {
            if (url) {
              img.src = url;
              img.style.display = "block";
            } else {
              img.removeAttribute("src");
              img.style.display = "none";
            }
          });
          cafeLabels.forEach(function (label) {
            label.style.display = url ? "none" : "";
          });
        }

        urlInput.value = normalizeUrl(params.get("url") || defaultUrl);
        cafeInput.value = params.get("cafe") || "";
        rewardInput.value = params.get("reward") || "";

        // ?cafeAddress=0x... (separate from the cosmetic ?cafe= name param)
        // pulls the cafe's own chosen card color and always fills in
        // name/reward/QR-target/logo from its real profile (see note below on
        // why this doesn't defer to any pre-existing cafe/reward/url params).
        var cafeAddressParam = (params.get("cafeAddress") || "").trim();
        if (cafeAddressParam) {
          fetch("/api/cafes/public")
            .then(function (res) {
              return res.json();
            })
            .then(function (data) {
              var cafes = (data && data.cafes) || [];
              var found = cafes.find(function (c) {
                return (
                  String(c.cafeAddress || "").toLowerCase() ===
                  cafeAddressParam.toLowerCase()
                );
              });
              if (!found) return;

              if (found.cardBgColor && found.cardFgColor) {
                document.documentElement.style.setProperty(
                  "--cafe-block-bg",
                  found.cardBgColor,
                );
                document.documentElement.style.setProperty(
                  "--cafe-block-fg",
                  found.cardFgColor,
                );
                var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(
                  found.cardFgColor,
                );
                if (m) {
                  var r = parseInt(m[1], 16);
                  var g = parseInt(m[2], 16);
                  var b = parseInt(m[3], 16);
                  document.documentElement.style.setProperty(
                    "--cafe-block-fg-soft",
                    "rgba(" + r + ", " + g + ", " + b + ", 0.64)",
                  );
                }
              }

              // cafeAddress is the authoritative source once present - always
              // wins over cafe/reward/url, even if those are already baked
              // into the address bar from a previous render() -> updateHistory()
              // call for a *different* cafe (e.g. the user edited cafeAddress
              // by hand in an already-open tab). Otherwise the stale values
              // silently stick and the QR keeps pointing at the old cafe.
              if (found.name) {
                cafeInput.value = found.name;
              }
              if (found.program && found.program.rewardDescription) {
                rewardInput.value = found.program.rewardDescription;
              }
              urlInput.value = normalizeUrl(
                "/cafe-join?cafe=" + encodeURIComponent(cafeAddressParam),
              );

              setCafeLogo(found.logoDataUrl || null);
              render();
            })
            .catch(function () {
              /* Kein Blocker - Aufsteller funktioniert auch ohne Cafe-Farbe. */
            });
        }

        updateBtn.addEventListener("click", render);
        printBtn.addEventListener("click", function () {
          // Erst wirklich fertig zeichnen lassen, dann drucken - sonst
          // schnappt der Print-Dialog eine leere QR-Karte.
          render().then(function () {
            window.print();
          });
        });

        urlInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") render();
        });

        cafeInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") render();
        });

        rewardInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") render();
        });

        render();
      })();
    </script>
  </body>
</html>
