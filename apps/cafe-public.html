<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café Profil</title>
    <link rel="stylesheet" href="/theme.css" />
    <style>
      body {
        padding: calc(var(--space-5) + var(--safe-top, 0px))
          calc(var(--space-5) + var(--safe-right, 0px))
          calc(var(--space-5) + var(--safe-bottom, 0px))
          calc(var(--space-5) + var(--safe-left, 0px));
      }
      .shell {
        max-width: 860px;
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--space-3);
        flex-wrap: wrap;
        margin-bottom: var(--space-4);

        padding: 18px 20px;
        border: 1px solid rgba(17, 17, 17, 0.08);
        background: linear-gradient(180deg, rgba(255, 252, 248, 0.88), rgba(246, 238, 229, 0.82));
        box-shadow:
          0 16px 40px rgba(68, 41, 22, 0.06),
          0 1px 0 rgba(255, 255, 255, 0.74) inset;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        min-width: 0;
      }

      .brandText {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .logo {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        border: none;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--bg);
        flex: 0 0 auto;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
      }

      .logo .fallback {
        font-weight: 950;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
      }
      .brand h1 {
        margin: 0;
        font-size: 20px;
        font-family: var(--font-display);
        letter-spacing: -0.03em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .subtitle {
        font-size: 13px;
        color: var(--text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hero {
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        overflow: hidden;
      }
      .hero img {
        width: 100%;
        height: 240px;
        object-fit: cover;
        display: block;
        background: var(--surface-muted);
      }
      @media (min-width: 860px) {
        .hero img {
          height: 320px;
        }
      }
      .gallery {
        display: none;
        gap: var(--space-2);
        overflow-x: auto;
        padding-top: var(--space-3);
        -webkit-overflow-scrolling: touch;
      }
      .thumb {
        width: 110px;
        height: 76px;
        border-radius: 0;
        border: none;
        background: var(--surface);
        object-fit: cover;
        flex: 0 0 auto;
        cursor: pointer;
      }
      .about {
        border-top: 1px solid var(--border);
        padding: var(--space-4) 0;
        font-size: 13px;
        line-height: 1.45;
        color: var(--text);
        white-space: pre-wrap;
      }
      .section {
        padding: var(--space-4) 0;
      }
      .section + .section {
        border-top: 1px solid var(--border);
      }
      .factsGrid {
        display: grid;
        gap: var(--space-3);
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
      .factCard {
        padding: 14px 16px;
        border-radius: 18px;
        border: 1px solid rgba(17, 17, 17, 0.08);
        background: rgba(255, 255, 255, 0.6);
        display: grid;
        gap: 6px;
      }
      .factLabel {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .factValue {
        font-size: 15px;
        line-height: 1.45;
        color: var(--text);
      }
      .factValue a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(17, 17, 17, 0.16);
      }
      .actions {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
      }
      .actions .btn {
        flex: 1;
        min-width: 220px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="brand">
          <a class="kk-brand" href="/">
            <span class="kk-brandMark" aria-hidden="true">
              <img src="/assets/stamp-bean.png?v=2" alt="" />
            </span>
            <span class="kk-brandText">
              <span class="kk-brandKicker">Kaffee im Veedel</span>
              <span class="kk-brandWord">Suelzer Kaffeekarte</span>
            </span>
          </a>
          <div class="logo" id="logoWrap" style="display: none">
            <img id="logoImg" alt="" />
            <div class="fallback" id="logoFallback" style="display: none">
              C
            </div>
          </div>
          <div class="brandText">
            <h1 id="title">Café Profil</h1>
            <div class="subtitle" id="addr">-</div>
          </div>
        </div>
        <div class="actions">
          <a class="btn secondary" href="/customer-map?view=map">Zur Map</a>
        </div>
      </div>

      <div class="card" style="padding: 0">
        <div id="error" class="notice danger" style="display: none"></div>

        <div class="hero" id="heroWrap" style="display: none">
          <img id="heroImg" alt="Café Bild" />
        </div>
        <div class="gallery" id="gallery"></div>

        <div class="section" style="margin-top: var(--space-3)">
          <div id="about" class="about" style="display: none"></div>
          <div id="aboutEmpty" class="hint" style="display: none">
            Noch keine Beschreibung. Vielleicht spricht das Café lieber durch den Espresso.
          </div>
        </div>

        <div class="section">
          <div class="factsGrid" style="margin-bottom: var(--space-3)">
            <div class="factCard" id="rewardCard" style="display: none">
              <div class="factLabel">Belohnung</div>
              <div class="factValue" id="rewardValue"></div>
            </div>
            <div class="factCard" id="locationCard" style="display: none">
              <div class="factLabel">Standort</div>
              <div class="factValue" id="locationValue"></div>
            </div>
            <div class="factCard" id="linksCard" style="display: none">
              <div class="factLabel">Mehr vom Café</div>
              <div class="factValue" id="linksValue"></div>
            </div>
          </div>

          <div id="redeem" class="notice" style="display: none"></div>

          <div class="actions" style="margin-top: var(--space-3)">
            <button class="btn primary" id="addBtn" type="button">
              Karte holen
            </button>
            <a class="btn secondary" id="backToWallet" href="/customer-wallet"
              >Zu deinen Karten</a
            >
          </div>
        </div>
      </div>
    </div>

    <script src="/ui.js"></script>
    <script>
      const FAVORITES_KEY = "customer_favorites_v1";

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatRichText(raw) {
        const src = String(raw || "");
        if (!src.trim()) return "";
        const lines = src.split(/\r?\n/);
        const out = [];
        for (const line of lines) {
          const trimmed = String(line || "").trim();
          if (!trimmed) {
            out.push('<div style="height:10px"></div>');
            continue;
          }
          let style = "font-weight:700;font-size:13px;line-height:1.45";
          let content = trimmed;
          if (/^##\s+/.test(content)) {
            style = "font-weight:950;font-size:15px;line-height:1.2";
            content = content.replace(/^##\s+/, "");
          } else if (/^#\s+/.test(content)) {
            style = "font-weight:950;font-size:18px;line-height:1.15";
            content = content.replace(/^#\s+/, "");
          }
          let safe = escapeHtml(content);
          safe = safe.replace(/\*\*([^*][\s\S]*?)\*\*/g, "<strong>$1</strong>");
          out.push(`<div style="${style}">${safe}</div>`);
        }
        return out.join("");
      }

      function normalizeAddr(v) {
        return v ? String(v).toLowerCase() : "";
      }

      function loadFavorites() {
        try {
          const raw = localStorage.getItem(FAVORITES_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          const set = new Set();
          for (const v of Array.isArray(arr) ? arr : []) {
            const s = normalizeAddr(v);
            if (s) set.add(s);
          }
          return set;
        } catch {
          return new Set();
        }
      }

      function saveFavorites(set) {
        try {
          localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(set)));
        } catch {}
      }

      async function apiFetch(path) {
        const base =
          location.protocol === "file:"
            ? "http://127.0.0.1:8080"
            : location.origin;
        const res = await fetch(`${base}/api${path}`, {
          cache: "no-store",
        });
        const text = await res.text();
        let data = null;
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          data = text;
        }
        if (!res.ok) {
          const err = new Error("api_error");
          err.status = res.status;
          err.responseText =
            typeof text === "string" ? text : String(text || "");
          throw err;
        }
        return data;
      }

      function setError(msg) {
        const el = document.getElementById("error");
        if (!el) return;
        el.textContent = msg || "";
        el.style.display = msg ? "block" : "none";
      }

      function setHero(src) {
        const wrap = document.getElementById("heroWrap");
        const img = document.getElementById("heroImg");
        if (!wrap || !img) return;
        if (!src) {
          wrap.style.display = "none";
          img.removeAttribute("src");
          return;
        }
        img.src = src;
        wrap.style.display = "block";
      }

      function renderGallery(list) {
        const g = document.getElementById("gallery");
        if (!g) return;
        g.innerHTML = "";
        const arr = Array.isArray(list) ? list : [];
        if (arr.length <= 1) {
          g.style.display = "none";
          return;
        }
        for (const src of arr) {
          const img = document.createElement("img");
          img.className = "thumb";
          img.alt = "Café Bild";
          img.src = src;
          img.addEventListener("click", () => setHero(src));
          g.appendChild(img);
        }
        g.style.display = "flex";
      }

      (async function boot() {
        try {
          const params = new URLSearchParams(location.search);
          const id = params.get("id");
          if (!id) {
            setError("Fehlende Café-ID (Parameter 'id').");
            return;
          }

          const data = await apiFetch(
            `/cafes/public/${encodeURIComponent(id)}`,
          );
          const cafe = data && data.cafe ? data.cafe : null;
          if (!cafe) throw new Error("cafe_not_found");

          const title = document.getElementById("title");
          const addr = document.getElementById("addr");
          if (title) title.textContent = cafe.name || "Café";
          if (addr) addr.textContent = cafe.address || "";

          const rewardCard = document.getElementById("rewardCard");
          const rewardValue = document.getElementById("rewardValue");
          const rewardGoal =
            cafe &&
            cafe.program &&
            Number.isFinite(Number(cafe.program.stampsForReward))
              ? Number(cafe.program.stampsForReward)
              : null;
          const rewardText =
            cafe && cafe.program && cafe.program.rewardDescription
              ? String(cafe.program.rewardDescription).trim()
              : "";
          if (rewardCard && rewardValue) {
            if (rewardGoal || rewardText) {
              rewardValue.textContent = rewardText
                ? `${rewardGoal || 10} Stempel - ${rewardText}`
                : `${rewardGoal || 10} Stempel bis zur Belohnung`;
              rewardCard.style.display = "grid";
            } else {
              rewardCard.style.display = "none";
            }
          }

          const locationCard = document.getElementById("locationCard");
          const locationValue = document.getElementById("locationValue");
          if (locationCard && locationValue) {
            if (cafe.address) {
              locationValue.textContent = String(cafe.address);
              locationCard.style.display = "grid";
            } else {
              locationCard.style.display = "none";
            }
          }

          const linksCard = document.getElementById("linksCard");
          const linksValue = document.getElementById("linksValue");
          if (linksCard && linksValue) {
            const links = [];
            if (cafe.websiteUrl) {
              links.push(
                `<a href="${escapeHtml(String(cafe.websiteUrl))}" target="_blank" rel="noopener noreferrer">Website</a>`,
              );
            }
            if (cafe.instagramUrl) {
              links.push(
                `<a href="${escapeHtml(String(cafe.instagramUrl))}" target="_blank" rel="noopener noreferrer">Instagram</a>`,
              );
            }
            if (links.length) {
              linksValue.innerHTML = links.join("<br />");
              linksCard.style.display = "grid";
            } else {
              linksCard.style.display = "none";
            }
          }

          // Logo in header (separate from hero/gallery)
          const logoWrap = document.getElementById("logoWrap");
          const logoImg = document.getElementById("logoImg");
          const logoFallback = document.getElementById("logoFallback");
          const logo = cafe.logoDataUrl ? String(cafe.logoDataUrl) : "";
          if (logoWrap) {
            if (logo) {
              if (logoImg) {
                logoImg.src = logo;
                logoImg.style.display = "block";
              }
              if (logoFallback) logoFallback.style.display = "none";
              logoWrap.style.display = "grid";
            } else {
              // Fallback initial
              const initial = (cafe.name || "C")
                .trim()
                .slice(0, 1)
                .toUpperCase();
              if (logoFallback) {
                logoFallback.textContent = initial || "C";
                logoFallback.style.display = "block";
              }
              if (logoImg) logoImg.style.display = "none";
              logoWrap.style.display = "grid";
            }
          }

          const about = cafe.about ? String(cafe.about).trim() : "";
          const aboutEl = document.getElementById("about");
          const aboutEmpty = document.getElementById("aboutEmpty");
          if (aboutEl) {
            aboutEl.innerHTML = formatRichText(about);
            aboutEl.style.display = about ? "block" : "none";
          }
          if (aboutEmpty) aboutEmpty.style.display = about ? "none" : "block";

          const redeemEl = document.getElementById("redeem");
          if (redeemEl) {
            redeemEl.textContent = "";
            redeemEl.style.display = "none";
          }


          // Hero/gallery prefer real photos; avoid using the logo as the hero image.
          const images = [];
          if (Array.isArray(cafe.images)) {
            for (const x of cafe.images) {
              if (!x) continue;
              const s = String(x);
              if (s && !images.includes(s)) images.push(s);
            }
          }
          setHero(images[0] || logo || "");
          renderGallery(images.length ? images : logo ? [logo] : []);

          const cafeAddress = cafe.cafeAddress ? String(cafe.cafeAddress) : "";
          const addBtn = document.getElementById("addBtn");
          const backToWallet = document.getElementById("backToWallet");
          const href = cafeAddress
            ? `/customer-wallet?cafe=${encodeURIComponent(cafeAddress)}`
            : "/customer-wallet";
          if (backToWallet) backToWallet.href = href;

          if (addBtn) {
            const fav = loadFavorites();
            const key = normalizeAddr(cafeAddress);
            addBtn.textContent =
              key && fav.has(key) ? "In deinen Karten" : "Karte holen";
            addBtn.addEventListener("click", () => {
              if (!cafeAddress) {
                location.href = "/customer-wallet";
                return;
              }
              const set = loadFavorites();
              set.add(normalizeAddr(cafeAddress));
              saveFavorites(set);
              location.href = href;
            });
          }
        } catch (e) {
          setError(
            stampUI.userSafeErrorMessage(
              e,
              "Café-Seite konnte nicht geladen werden.",
            ),
          );
        }
      })();
    </script>
  </body>
</html>
