<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café Profil - Kaffeekarte</title>
    <link rel="stylesheet" href="/theme.css" />
    <style>
      :root {
        --glass: rgba(255, 251, 246, 0.82);
        --line: rgba(81, 58, 40, 0.1);
      }

      body {
        min-height: 100svh;
        background: var(--color-background);
        color: var(--text);
        padding: calc(var(--space-4) + var(--safe-top, 0px))
          calc(var(--space-4) + var(--safe-right, 0px))
          calc(var(--space-6) + var(--safe-bottom, 0px))
          calc(var(--space-4) + var(--safe-left, 0px));
      }

      .shell {
        max-width: 920px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }

      .topbar {
        position: sticky;
        top: calc(var(--safe-top, 0px) + 8px);
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        padding: 10px 18px;
        border-radius: 24px;
        border: 1px solid rgba(17, 17, 17, 0.08);
        background: rgba(255, 252, 248, 0.72);
        backdrop-filter: blur(18px);
        box-shadow:
          0 10px 24px rgba(68, 41, 22, 0.05),
          0 1px 0 rgba(255, 255, 255, 0.68) inset;
        /* Reacts to scroll: stretches slightly on the native overscroll
           bounce so that (already-active) physics gets a visible response. */
        transform: scale(var(--topbar-stretch, 1));
        transform-origin: top center;
      }

      .topbar .kk-brandMark {
        width: 48px;
        height: 48px;
      }

      .topbar .kk-brandWord {
        font-size: 24px;
      }

      .topbarActions {
        flex: 0 0 auto;
      }

      /* border-radius/border/background/box-shadow now come from the
         shared .card class (theme.css, added alongside this class in the
         markup) so every "main content card" reads as the same matte
         material instead of this page's own translucent glass look. */
      .profileCard {
        overflow: hidden;
      }

      .hero img {
        width: 100%;
        height: 260px;
        object-fit: cover;
        display: block;
        background: var(--surface-muted);
      }

      @media (min-width: 860px) {
        .hero img {
          height: 340px;
        }
      }

      .gallery {
        display: none;
        gap: 10px;
        overflow-x: auto;
        padding: 14px clamp(22px, 4vw, 36px) 0;
        -webkit-overflow-scrolling: touch;
      }

      .thumb {
        width: 110px;
        height: 76px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--surface);
        object-fit: cover;
        flex: 0 0 auto;
        cursor: pointer;
      }

      .profileBody {
        padding: clamp(22px, 4vw, 36px);
        display: grid;
        gap: 22px;
      }

      .profileHead {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
      }

      .logo {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        border: 1px solid var(--line);
        display: grid;
        place-items: center;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.9);
        flex: 0 0 auto;
        box-shadow:
          0 14px 24px rgba(47, 31, 22, 0.08),
          0 1px 0 rgba(255, 255, 255, 0.82) inset;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        display: block;
      }

      .logo .fallback {
        font-weight: 950;
        font-size: 16px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
      }

      .profileTitle {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .profileTitle h1 {
        margin: 0;
        font-weight: 900;
        /* Sans everywhere now (was the only serif heading in the app) and
           capped at the same ~26px other pages use for their main title,
           but still shrinks for long café names on narrow screens instead
           of a flat size. */
        font-size: clamp(22px, 4.5vw, 26px);
        line-height: 1.05;
        letter-spacing: -0.03em;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .subtitle {
        font-size: 14px;
        color: rgba(59, 42, 31, 0.72);
      }

      .about {
        font-size: 15px;
        line-height: 1.6;
        color: rgba(59, 42, 31, 0.82);
        white-space: pre-wrap;
        max-width: 62ch;
      }

      .factsGrid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }

      .factCard {
        padding: 16px 18px;
        border-radius: 20px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.6);
        display: grid;
        gap: 6px;
        align-content: start;
      }

      .factLabel {
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .factValue {
        font-size: 15px;
        line-height: 1.5;
        color: var(--text);
      }

      .factValue a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(81, 58, 40, 0.24);
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .actions .btn {
        flex: 1;
        min-width: 220px;
      }

      @media (max-width: 640px) {
        .actions .btn {
          min-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <a class="kk-brand" href="/wallet">
          <span class="kk-brandMark" aria-hidden="true">
            <img src="/assets/stamp-bean.png?v=2" alt="" />
          </span>
          <span class="kk-brandText">
            <span class="kk-brandKicker">Kaffee im Veedel</span>
            <span class="kk-brandWord">Kaffeekarte</span>
          </span>
        </a>
        <div class="row"></div>
      </div>

      <div class="card card--hairline profileCard">
        <div id="error" class="notice danger" style="display: none; margin: 20px"></div>

        <div class="hero" id="heroWrap" style="display: none">
          <img id="heroImg" alt="Café Bild" />
        </div>
        <div class="gallery" id="gallery"></div>

        <div class="profileBody">
          <div class="profileHead">
            <div class="logo" id="logoWrap" style="display: none">
              <img id="logoImg" alt="" />
              <div class="fallback" id="logoFallback" style="display: none">
                C
              </div>
            </div>
            <div class="profileTitle">
              <h1 id="title">Café Profil</h1>
              <div class="subtitle" id="addr">-</div>
            </div>
          </div>

          <div>
            <div id="about" class="about" style="display: none"></div>
            <div id="aboutEmpty" class="hint" style="display: none">
              Noch keine Beschreibung. Vielleicht spricht das Café lieber durch den Espresso.
            </div>
          </div>

          <div class="factsGrid">
            <div class="factCard" id="rewardCard" style="display: none">
              <div class="factLabel">Belohnung</div>
              <div class="factValue" id="rewardValue"></div>
            </div>
            <div class="factCard" id="locationCard" style="display: none">
              <div class="factLabel">Standort</div>
              <div class="factValue" id="locationValue"></div>
            </div>
            <div class="factCard" id="linksCard" style="display: none">
              <div class="factLabel">Mehr vom Café</div>
              <div class="factValue" id="linksValue"></div>
            </div>
          </div>

          <div id="redeem" class="notice" style="display: none"></div>

          <div class="actions">
            <button class="btn primary" id="addBtn" type="button">
              Karte holen
            </button>
            <a class="btn secondary" id="backToWallet" href="/customer-wallet"
              >Meine Karten öffnen</a
            >
          </div>
        </div>
      </div>
    </div>

    <script src="/ui.js"></script>
    <script>
      if (window.stampUI && stampUI.mountBottomNav) {
        var tabIcons = (window.stampUI && stampUI.tabIcons) || {};
        var kkNav = stampUI.mountBottomNav({
          theme: "espresso",
          items: [
            {
              id: "bottomModeMap",
              label: "Entdecken",
              icon: tabIcons.discover,
              href: "/customer-map?view=map",
              active: true,
            },
            {
              id: "bottomModeWallet",
              label: "Wallet",
              icon: tabIcons.wallet,
              href: "/customer-wallet?view=cards",
            },
            {
              id: "bottomModeHistory",
              label: "Checkins",
              icon: tabIcons.history,
              href: "/customer-history",
            },
          ],
        });
        var walletTab = document.getElementById("bottomModeWallet");
        if (walletTab) walletTab.classList.add("kk-tab--featured");
      }
      if (window.stampUI && stampUI.mountCustomerTopProfile) {
        stampUI.mountCustomerTopProfile({ href: "/customer-profile" });
      }
    </script>
    <script>
      const FAVORITES_KEY = "customer_favorites_v1";

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatRichText(raw) {
        const src = String(raw || "");
        if (!src.trim()) return "";
        const lines = src.split(/\r?\n/);
        const out = [];
        for (const line of lines) {
          const trimmed = String(line || "").trim();
          if (!trimmed) {
            out.push('<div style="height:10px"></div>');
            continue;
          }
          let style = "font-weight:500;font-size:15px;line-height:1.6";
          let content = trimmed;
          if (/^##\s+/.test(content)) {
            style = "font-weight:900;font-size:17px;line-height:1.25";
            content = content.replace(/^##\s+/, "");
          } else if (/^#\s+/.test(content)) {
            style = "font-weight:900;font-size:20px;line-height:1.2";
            content = content.replace(/^#\s+/, "");
          }
          let safe = escapeHtml(content);
          safe = safe.replace(/\*\*([^*][\s\S]*?)\*\*/g, "<strong>$1</strong>");
          out.push(`<div style="${style}">${safe}</div>`);
        }
        return out.join("");
      }

      function normalizeAddr(v) {
        return v ? String(v).toLowerCase() : "";
      }

      function loadFavorites() {
        try {
          const raw = localStorage.getItem(FAVORITES_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          const set = new Set();
          for (const v of Array.isArray(arr) ? arr : []) {
            const s = normalizeAddr(v);
            if (s) set.add(s);
          }
          return set;
        } catch {
          return new Set();
        }
      }

      function saveFavorites(set) {
        try {
          localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(set)));
        } catch {}
      }

      async function apiFetch(path) {
        const base =
          location.protocol === "file:"
            ? "http://127.0.0.1:8080"
            : location.origin;
        const res = await fetch(`${base}/api${path}`, {
          cache: "no-store",
        });
        const text = await res.text();
        let data = null;
        try {
          data = text ? JSON.parse(text) : null;
        } catch {
          data = text;
        }
        if (!res.ok) {
          const err = new Error("api_error");
          err.status = res.status;
          err.responseText =
            typeof text === "string" ? text : String(text || "");
          throw err;
        }
        return data;
      }

      function setError(msg) {
        const el = document.getElementById("error");
        if (!el) return;
        el.textContent = msg || "";
        el.style.display = msg ? "block" : "none";
      }

      function setHero(src) {
        const wrap = document.getElementById("heroWrap");
        const img = document.getElementById("heroImg");
        if (!wrap || !img) return;
        if (!src) {
          wrap.style.display = "none";
          img.removeAttribute("src");
          return;
        }
        img.src = src;
        wrap.style.display = "block";
      }

      function renderGallery(list) {
        const g = document.getElementById("gallery");
        if (!g) return;
        g.innerHTML = "";
        const arr = Array.isArray(list) ? list : [];
        if (arr.length <= 1) {
          g.style.display = "none";
          return;
        }
        for (const src of arr) {
          const img = document.createElement("img");
          img.className = "thumb";
          img.alt = "Café Bild";
          img.src = src;
          img.addEventListener("click", () => setHero(src));
          g.appendChild(img);
        }
        g.style.display = "flex";
      }

      (async function boot() {
        try {
          const params = new URLSearchParams(location.search);
          const id = params.get("id");
          if (!id) {
            setError("Fehlende Café-ID (Parameter 'id').");
            return;
          }

          const data = await apiFetch(
            `/cafes/public/${encodeURIComponent(id)}`,
          );
          const cafe = data && data.cafe ? data.cafe : null;
          if (!cafe) throw new Error("cafe_not_found");

          const title = document.getElementById("title");
          const addr = document.getElementById("addr");
          if (title) title.textContent = cafe.name || "Café";
          if (addr) addr.textContent = cafe.address || "";

          const rewardCard = document.getElementById("rewardCard");
          const rewardValue = document.getElementById("rewardValue");
          const rewardGoal =
            cafe &&
            cafe.program &&
            Number.isFinite(Number(cafe.program.stampsForReward))
              ? Number(cafe.program.stampsForReward)
              : null;
          const rewardText =
            cafe && cafe.program && cafe.program.rewardDescription
              ? String(cafe.program.rewardDescription).trim()
              : "";
          if (rewardCard && rewardValue) {
            if (rewardGoal || rewardText) {
              rewardValue.textContent = rewardText
                ? `${rewardGoal || 10} Stempel - ${rewardText}`
                : `${rewardGoal || 10} Stempel bis zur Belohnung`;
              rewardCard.style.display = "grid";
            } else {
              rewardCard.style.display = "none";
            }
          }

          const locationCard = document.getElementById("locationCard");
          const locationValue = document.getElementById("locationValue");
          if (locationCard && locationValue) {
            if (cafe.address) {
              const mapsUrl =
                "https://www.google.com/maps/search/?api=1&query=" +
                encodeURIComponent(String(cafe.address));
              locationValue.innerHTML =
                escapeHtml(String(cafe.address)) +
                `<br /><a href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener noreferrer">Route planen</a>`;
              locationCard.style.display = "grid";
            } else {
              locationCard.style.display = "none";
            }
          }

          const linksCard = document.getElementById("linksCard");
          const linksValue = document.getElementById("linksValue");
          if (linksCard && linksValue) {
            const links = [];
            if (cafe.websiteUrl) {
              links.push(
                `<a href="${escapeHtml(String(cafe.websiteUrl))}" target="_blank" rel="noopener noreferrer">Website</a>`,
              );
            }
            if (cafe.instagramUrl) {
              links.push(
                `<a href="${escapeHtml(String(cafe.instagramUrl))}" target="_blank" rel="noopener noreferrer">Instagram</a>`,
              );
            }
            if (links.length) {
              linksValue.innerHTML = links.join("<br />");
              linksCard.style.display = "grid";
            } else {
              linksCard.style.display = "none";
            }
          }

          // Logo in header (separate from hero/gallery)
          const logoWrap = document.getElementById("logoWrap");
          const logoImg = document.getElementById("logoImg");
          const logoFallback = document.getElementById("logoFallback");
          const logo = cafe.logoDataUrl ? String(cafe.logoDataUrl) : "";
          if (logoWrap) {
            if (logo) {
              if (logoImg) {
                logoImg.src = logo;
                logoImg.style.display = "block";
              }
              if (logoFallback) logoFallback.style.display = "none";
              logoWrap.style.display = "grid";
            } else {
              // Fallback initial
              const initial = (cafe.name || "C")
                .trim()
                .slice(0, 1)
                .toUpperCase();
              if (logoFallback) {
                logoFallback.textContent = initial || "C";
                logoFallback.style.display = "block";
              }
              if (logoImg) logoImg.style.display = "none";
              logoWrap.style.display = "grid";
            }
          }

          const about = cafe.about ? String(cafe.about).trim() : "";
          const aboutEl = document.getElementById("about");
          const aboutEmpty = document.getElementById("aboutEmpty");
          if (aboutEl) {
            aboutEl.innerHTML = formatRichText(about);
            aboutEl.style.display = about ? "block" : "none";
          }
          if (aboutEmpty) aboutEmpty.style.display = about ? "none" : "block";

          const redeemEl = document.getElementById("redeem");
          if (redeemEl) {
            redeemEl.textContent = "";
            redeemEl.style.display = "none";
          }


          // Hero/gallery prefer real photos; avoid using the logo as the hero image.
          const images = [];
          if (Array.isArray(cafe.images)) {
            for (const x of cafe.images) {
              if (!x) continue;
              const s = String(x);
              if (s && !images.includes(s)) images.push(s);
            }
          }
          setHero(images[0] || logo || "");
          renderGallery(images.length ? images : logo ? [logo] : []);

          const cafeAddress = cafe.cafeAddress ? String(cafe.cafeAddress) : "";
          const addBtn = document.getElementById("addBtn");
          const backToWallet = document.getElementById("backToWallet");
          const cardHref = cafeAddress
            ? `/customer-wallet?cafe=${encodeURIComponent(cafeAddress)}`
            : "/customer-wallet";

          if (addBtn) {
            const fav = loadFavorites();
            const key = normalizeAddr(cafeAddress);
            const alreadyAdded = !!(key && fav.has(key));
            if (alreadyAdded) {
              // Karte existiert schon: ein einziger, eindeutiger Weg zur Stempelkarte.
              addBtn.textContent = "Zur Stempelkarte";
              if (backToWallet) backToWallet.style.display = "none";
            } else {
              addBtn.textContent = "Karte holen";
              if (backToWallet) {
                backToWallet.textContent = "Meine Karten öffnen";
                backToWallet.href = "/customer-wallet";
              }
            }
            addBtn.addEventListener("click", () => {
              if (!cafeAddress) {
                location.href = "/customer-wallet";
                return;
              }
              const set = loadFavorites();
              set.add(normalizeAddr(cafeAddress));
              saveFavorites(set);
              location.href = cardHref;
            });
          }
        } catch (e) {
          setError(
            stampUI.userSafeErrorMessage(
              e,
              "Café-Seite konnte nicht geladen werden.",
            ),
          );
        }
      })();
    </script>
    <script>
      (function () {
        var topbar = document.querySelector(".topbar");
        if (!topbar) return;

        var ticking = false;
        function paint() {
          ticking = false;
          var y = window.scrollY || window.pageYOffset || 0;
          topbar.classList.toggle("topbar--solid", y > 20);
          if (y < 0) {
            var stretch = Math.min(1, Math.max(0, -y / 90));
            topbar.style.setProperty("--topbar-stretch", (1 + stretch * 0.08).toFixed(3));
          } else {
            topbar.style.setProperty("--topbar-stretch", "1");
          }
        }
        function schedule() {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(paint);
        }
        window.addEventListener("scroll", schedule, { passive: true });
        paint();
      })();
    </script>
  </body>
</html>
