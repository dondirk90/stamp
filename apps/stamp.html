<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stamp QR Landing</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.15.0/dist/ethers.umd.min.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 400px;
        margin: 40px auto;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 12px #0001;
        padding: 24px;
      }
      h1 {
        color: #1976d2;
        font-size: 1.5em;
        margin-bottom: 8px;
      }
      .info {
        background: #e3f2fd;
        color: #1976d2;
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 16px;
        font-size: 1em;
      }
      .param {
        font-family: monospace;
        color: #333;
        margin-bottom: 6px;
      }
      .btn {
        display: block;
        width: 100%;
        background: #1976d2;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 14px;
        font-size: 1.1em;
        font-weight: bold;
        margin-top: 18px;
        cursor: pointer;
      }
      .btn:active {
        background: #1565c0;
      }
      .small {
        font-size: 0.9em;
        color: #888;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Stamp QR erkannt</h1>
      <div class="info">
        Die folgenden Parameter wurden aus dem QR-Code gelesen:
      </div>
      <div class="param" id="cafeId">cafeId: -</div>
      <div class="param" id="nonce">nonce: -</div>
      <div class="param" id="expires">expires: -</div>
      <button class="btn" id="openCustomer" style="display: none">
        In Customer-App öffnen
      </button>
      <div id="result" class="info" style="margin-top: 18px"></div>
      <div class="small">
        Die Transaktion wird automatisch durchgeführt.<br />
        Falls nichts passiert, prüfe die Netzwerkverbindung oder lade die Seite
        neu.
      </div>
    </div>
    <script>
      // Konfiguration (kann ggf. als Input ergänzt werden)
      const API_BASE = "http://127.0.0.1:3000";
      const PRIVATE_KEY =
        "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d";
      const VERIFYING_CONTRACT = "0x5FbDB2315678afecb367f032d93F642f64180aa3";
      const CHAIN_ID = 31337;

      function getParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name) || "-";
      }
      document.getElementById("cafeId").textContent =
        "cafeId: " + getParam("cafeId");
      document.getElementById("nonce").textContent =
        "nonce: " + getParam("nonce");
      document.getElementById("expires").textContent =
        "expires: " + getParam("expires");

      async function autoSignAndSubmit() {
        const cafeId = getParam("cafeId");
        const nonce = getParam("nonce");
        const expires = getParam("expires");
        const resultEl = document.getElementById("result");
        if (
          !cafeId ||
          !nonce ||
          !expires ||
          cafeId === "-" ||
          nonce === "-" ||
          expires === "-"
        ) {
          resultEl.textContent =
            "❌ Fehler: Ungültige oder fehlende Parameter.";
          resultEl.className = "status error";
          return;
        }
        resultEl.textContent = "Signiere und sende Transaktion...";
        resultEl.className = "info";
        try {
          const wallet = new ethers.Wallet(PRIVATE_KEY);
          const domain = {
            name: "StampCard",
            version: "1",
            chainId: CHAIN_ID,
            verifyingContract: VERIFYING_CONTRACT,
          };
          const types = {
            StampRequest: [
              { name: "cafeId", type: "bytes16" },
              { name: "nonce", type: "bytes32" },
              { name: "expires", type: "uint256" },
              { name: "customer", type: "address" },
            ],
          };
          const message = {
            cafeId,
            nonce,
            expires: BigInt(expires),
            customer: wallet.address,
          };
          const signature = await wallet.signTypedData(domain, types, message);
          const payload = {
            cafeId,
            nonce,
            expires: Number(expires),
            customer: wallet.address,
            signature,
          };
          const apiUrl = API_BASE.replace(/\/$/, "") + "/stamp";
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (data.success) {
            resultEl.textContent =
              "✅ Stempel erfolgreich gesetzt!\n\n" +
              JSON.stringify(data, null, 2);
            resultEl.className = "status success";
          } else {
            resultEl.textContent =
              "❌ Fehler: " + JSON.stringify(data, null, 2);
            resultEl.className = "status error";
          }
        } catch (err) {
          resultEl.textContent = "❌ Fehler: " + (err.message || err);
          resultEl.className = "status error";
        }
      }

      window.addEventListener("DOMContentLoaded", autoSignAndSubmit);
    </script>
  </body>
</html>
