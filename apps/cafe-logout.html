<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Café Logout</title>
    <meta http-equiv="cache-control" content="no-store" />
    <meta http-equiv="pragma" content="no-cache" />
    <link rel="stylesheet" href="/theme.css" />
    <style>
      body {
        padding: calc(var(--space-5) + var(--safe-top, 0px))
          calc(var(--space-5) + var(--safe-right, 0px))
          calc(var(--space-5) + var(--safe-bottom, 0px))
          calc(var(--space-5) + var(--safe-left, 0px));
      }
      .box {
        max-width: 560px;
        margin: 40px auto;
        padding: 0;
      }
      .muted {
        color: var(--text-muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body class="theme-invert">
    <div class="card box">
      <div style="font-weight: 950; color: var(--brand)">Abmelden…</div>
      <div class="muted">
        Session wird entfernt und du wirst weitergeleitet.
      </div>
    </div>

    <script>
      (function () {
        try {
          localStorage.removeItem("cafe_session");
          localStorage.removeItem("last_scanned_customer");
        } catch (e) {}

        try {
          // Give the browser a tick to persist storage changes.
          setTimeout(function () {
            try {
              window.location.replace("/cafe-onboarding");
            } catch (e2) {
              window.location.href = "/cafe-onboarding";
            }
          }, 50);
        } catch (e3) {
          window.location.href = "/cafe-onboarding";
        }
      })();
    </script>
  </body>
</html>
