// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 8.10.0: minimum AGP that supports compileSdk 36 (Android 16) per
        // Google's own Android 16 setup guide, chosen specifically because
        // its own minimum required Gradle version (8.11.1) is exactly what
        // this project's wrapper already pins - no Gradle bump needed too.
        classpath 'com.android.tools.build:gradle:8.10.0'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
