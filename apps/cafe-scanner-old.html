<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Café Scanner - Stamp</title>
    <style>
      body {
        font-family: system-ui, Segoe UI, Roboto, Arial;
        background: #fafafa;
        padding: 20px;
        margin: 0;
      }
      .card {
        max-width: 720px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
      }
      input,
      button,
      select {
        padding: 12px;
        margin: 6px 0;
        width: 100%;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      button {
        background: #667eea;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #5568d3;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      #video {
        width: 100%;
        max-width: 480px;
        border-radius: 8px;
        border: 2px solid #eee;
        display: block;
        margin: 12px auto;
      }
      .profile-card {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: #fff;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 16px;
      }
      .customer-card {
        background: #f7fafc;
        padding: 16px;
        border-radius: 8px;
        margin: 12px 0;
        border-left: 4px solid #667eea;
      }
      .success {
        background: #10b981;
        color: #fff;
        padding: 12px;
        border-radius: 8px;
        margin: 12px 0;
      }
      .error {
        background: #ef4444;
        color: #fff;
        padding: 12px;
        border-radius: 8px;
        margin: 12px 0;
      }
      pre {
        background: #f4f4f4;
        padding: 10px;
        overflow: auto;
        border-radius: 6px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>☕ Café Scanner</h2>

      <!-- Café Profile (shown when logged in) -->
      <div id="cafeProfile" style="display: none" class="profile-card">
        <div style="font-size: 24px; font-weight: bold" id="cafeName">Café</div>
        <div
          style="font-size: 14px; opacity: 0.9; margin-top: 4px"
          id="cafeAddress"
        >
          0x...
        </div>
        <button
          id="logoutBtn"
          style="
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.2);
            width: auto;
            padding: 8px 16px;
          "
        >
          Logout
        </button>
      </div>

      <!-- Login Form -->
      <div id="loginForm">
        <p>
          Login mit deinem Café API-Key um QR-Codes zu scannen und Stempel zu
          vergeben.
        </p>
        <label>Café API Key</label>
        <input id="apiKeyInput" type="password" placeholder="Dein API Key" />
        <button id="loginBtn">Login</button>
        <div id="loginResult"></div>
      </div>

      <!-- Scanner Section (hidden until logged in) -->
      <div id="scannerSection" style="display: none">
        <h3>QR-Code scannen</h3>
        <p>Halte die Kamera auf den Kunden-QR-Code</p>
        <video id="video" autoplay></video>
        <button id="startScanBtn">Kamera starten</button>
        <button id="stopScanBtn" style="display: none">Kamera stoppen</button>

        <div id="scanResult"></div>

        <!-- Customer Info after scan -->
        <div id="customerInfo" style="display: none" class="customer-card">
          <h4>Kunde gescannt:</h4>
          <div><strong>Name:</strong> <span id="customerName"></span></div>
          <div>
            <strong>Adresse:</strong> <span id="customerAddress"></span>
          </div>
          <div>
            <strong>Aktuelle Stempel:</strong>
            <span id="customerStamps">...</span>
          </div>
          <label>Anzahl Stempel vergeben:</label>
          <input id="stampCount" type="number" min="1" max="10" value="1" />
          <button id="awardStampsBtn">Stempel vergeben</button>
        </div>
      </div>

      <h4>Debug / API</h4>
      <div style="display: flex; gap: 8px; margin-top: 8px">
        <input
          id="apiBaseInput"
          placeholder="http://127.0.0.1:3000"
          style="flex: 1"
        />
        <button id="setApiBtn" style="width: auto; padding: 0 16px">
          Set API
        </button>
      </div>
      <div id="apiStatus" style="margin-top: 8px; color: #666"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
      const apiKeyInput = document.getElementById("apiKeyInput");
      const loginBtn = document.getElementById("loginBtn");
      const loginResult = document.getElementById("loginResult");
      const loginForm = document.getElementById("loginForm");
      const cafeProfile = document.getElementById("cafeProfile");
      const cafeName = document.getElementById("cafeName");
      const cafeAddress = document.getElementById("cafeAddress");
      const logoutBtn = document.getElementById("logoutBtn");
      const scannerSection = document.getElementById("scannerSection");
      const video = document.getElementById("video");
      const startScanBtn = document.getElementById("startScanBtn");
      const stopScanBtn = document.getElementById("stopScanBtn");
      const scanResult = document.getElementById("scanResult");
      const customerInfo = document.getElementById("customerInfo");
      const customerName = document.getElementById("customerName");
      const customerAddress = document.getElementById("customerAddress");
      const customerStamps = document.getElementById("customerStamps");
      const stampCount = document.getElementById("stampCount");
      const awardStampsBtn = document.getElementById("awardStampsBtn");
      const apiBaseInput = document.getElementById("apiBaseInput");
      const setApiBtn = document.getElementById("setApiBtn");
      const apiStatus = document.getElementById("apiStatus");

      let apiBase = window.__API_BASE__ || "http://127.0.0.1:3000";
      let cafeApiKey = null;
      let cafeData = null;
      let scanStream = null;
      let scanning = false;
      let lastScanned = null;

      apiStatus.textContent = "API: " + apiBase;

      setApiBtn.addEventListener("click", () => {
        const v = apiBaseInput.value.trim();
        if (v) {
          apiBase = v;
          window.__API_BASE__ = v;
          apiStatus.textContent = "API: " + apiBase;
        }
      });

      // Login
      loginBtn.addEventListener("click", async () => {
        const key = apiKeyInput.value.trim();
        if (!key) {
          loginResult.textContent = "Bitte API Key eingeben";
          loginResult.className = "error";
          return;
        }
        loginResult.textContent = "Login läuft...";
        loginResult.className = "";
        try {
          // Verify API key by calling /debug/info with the key
          const res = await fetch(`${apiBase}/debug/info`, {
            headers: { "x-api-key": key },
          });
          if (!res.ok) {
            loginResult.textContent =
              "Login fehlgeschlagen (ungültiger API Key?)";
            loginResult.className = "error";
            return;
          }
          const data = await res.json();
          cafeApiKey = key;
          cafeData = { wallet: data.wallet };
          // Try to get cafe name from /cafes list
          try {
            const cafesRes = await fetch(`${apiBase}/cafes`);
            const cafes = await cafesRes.json();
            const myCafe = cafes.find((c) => c.api_key === key);
            if (myCafe) {
              cafeData.name = myCafe.name;
              cafeData.id = myCafe.id;
            }
          } catch (e) {}

          loginResult.textContent = "Login erfolgreich!";
          loginResult.className = "success";
          loginForm.style.display = "none";
          cafeProfile.style.display = "block";
          scannerSection.style.display = "block";
          cafeName.textContent = cafeData.name || "Café";
          cafeAddress.textContent = cafeData.wallet
            ? cafeData.wallet.slice(0, 6) + "..." + cafeData.wallet.slice(-4)
            : "";

          // Save session
          localStorage.setItem(
            "cafe_session",
            JSON.stringify({ apiKey: cafeApiKey, cafeData })
          );
        } catch (err) {
          loginResult.textContent = "Fehler: " + (err.message || err);
          loginResult.className = "error";
        }
      });

      logoutBtn.addEventListener("click", () => {
        cafeApiKey = null;
        cafeData = null;
        localStorage.removeItem("cafe_session");
        loginForm.style.display = "block";
        cafeProfile.style.display = "none";
        scannerSection.style.display = "none";
        customerInfo.style.display = "none";
        loginResult.textContent = "";
        if (scanStream) {
          scanStream.getTracks().forEach((t) => t.stop());
          scanStream = null;
        }
      });

      // Auto-login if session saved
      (() => {
        try {
          const raw = localStorage.getItem("cafe_session");
          if (!raw) return;
          const obj = JSON.parse(raw);
          if (obj && obj.apiKey) {
            apiKeyInput.value = obj.apiKey;
            // Auto-click login
            setTimeout(() => loginBtn.click(), 100);
          }
        } catch (e) {}
      })();

      // QR Scanner
      startScanBtn.addEventListener("click", async () => {
        try {
          scanResult.textContent = "Kamera wird gestartet...";
          scanResult.className = "";
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
          });
          video.srcObject = stream;
          scanStream = stream;
          scanning = true;
          startScanBtn.style.display = "none";
          stopScanBtn.style.display = "block";
          scanResult.textContent = "Kamera aktiv. Halte QR-Code ins Bild.";

          // Start scanning loop
          requestAnimationFrame(tick);
        } catch (err) {
          scanResult.textContent = "Kamera-Fehler: " + (err.message || err);
          scanResult.className = "error";
        }
      });

      stopScanBtn.addEventListener("click", () => {
        scanning = false;
        if (scanStream) {
          scanStream.getTracks().forEach((t) => t.stop());
          scanStream = null;
        }
        video.srcObject = null;
        startScanBtn.style.display = "block";
        stopScanBtn.style.display = "none";
        scanResult.textContent = "Kamera gestoppt";
      });

      function tick() {
        if (!scanning) return;
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          const canvas = document.createElement("canvas");
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, imageData.width, imageData.height);
          if (code && code.data) {
            // Prevent duplicate scans
            if (lastScanned === code.data) {
              requestAnimationFrame(tick);
              return;
            }
            lastScanned = code.data;
            onQRScanned(code.data);
          }
        }
        requestAnimationFrame(tick);
      }

      async function onQRScanned(data) {
        try {
          const payload = JSON.parse(data);
          if (!payload.customer || !payload.cafeId) {
            scanResult.textContent =
              "Ungültiger QR-Code (fehlt customer oder cafeId)";
            scanResult.className = "error";
            lastScanned = null; // allow rescan
            return;
          }

          scanResult.textContent = "QR gescannt! Lade Kundendaten...";
          scanResult.className = "success";

          customerName.textContent = payload.customerName || "Unbekannt";
          customerAddress.textContent = payload.customer;
          customerInfo.style.display = "block";

          // Fetch current stamp count
          try {
            const res = await fetch(
              `${apiBase}/stamps/${payload.customer}?fallback=1`
            );
            const stampData = await res.json();
            customerStamps.textContent = stampData.stamps || 0;
          } catch (e) {
            customerStamps.textContent = "?";
          }

          // Prepare award button
          awardStampsBtn.onclick = async () => {
            await awardStamps(payload.customer, payload.customerName);
          };
        } catch (err) {
          scanResult.textContent =
            "Fehler beim Parsen des QR-Codes: " + (err.message || err);
          scanResult.className = "error";
          lastScanned = null;
        }
      }

      async function awardStamps(customerAddr, custName) {
        if (!cafeApiKey) {
          scanResult.textContent = "Nicht eingeloggt!";
          scanResult.className = "error";
          return;
        }
        const count = parseInt(stampCount.value) || 1;
        awardStampsBtn.disabled = true;
        awardStampsBtn.textContent = "Sende...";
        try {
          const res = await fetch(`${apiBase}/stamp-by-cafe`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": cafeApiKey,
            },
            body: JSON.stringify({ customer: customerAddr, count }),
          });
          const result = await res.json();
          if (!res.ok) {
            scanResult.textContent =
              "Fehler: " + (result.error || JSON.stringify(result));
            scanResult.className = "error";
            awardStampsBtn.disabled = false;
            awardStampsBtn.textContent = "Stempel vergeben";
            return;
          }
          scanResult.textContent = `✅ ${count} Stempel vergeben an ${
            custName || customerAddr.slice(0, 6)
          }! TX: ${result.txHashes ? result.txHashes[0] : ""}`;
          scanResult.className = "success";

          // Update stamp count
          try {
            const stampRes = await fetch(
              `${apiBase}/stamps/${customerAddr}?fallback=1`
            );
            const stampData = await stampRes.json();
            customerStamps.textContent = stampData.stamps || 0;
          } catch (e) {}

          // Reset for next scan
          setTimeout(() => {
            lastScanned = null;
            customerInfo.style.display = "none";
            scanResult.textContent = "Bereit für nächsten Scan";
            awardStampsBtn.disabled = false;
            awardStampsBtn.textContent = "Stempel vergeben";
          }, 3000);
        } catch (err) {
          scanResult.textContent = "Netzwerk-Fehler: " + (err.message || err);
          scanResult.className = "error";
          awardStampsBtn.disabled = false;
          awardStampsBtn.textContent = "Stempel vergeben";
        }
      }
    </script>
  </body>
</html>
