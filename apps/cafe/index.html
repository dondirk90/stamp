<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cafe QR Issuer</title>
    <style>
      body {
        font-family: system-ui, Segoe UI, Roboto, Arial;
        margin: 20px;
      }
      label {
        display: block;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Café — QR Issuer</h1>
    <div
      style="
        background: #fff3cd;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 12px;
      "
    >
      <strong>📱 Smartphone Scanning:</strong>
      <p>
        Ersetze <code>127.0.0.1</code> unten durch deine Rechner-IP (z.B.
        <code>192.168.1.100</code>). Dann öffne diese URL auf deinem Smartphone.
      </p>
    </div>
    <label
      >API Base:
      <input id="api" value="http://127.0.0.1:3000" style="width: 320px"
    /></label>
    <label
      >API Key (x-api-key):
      <input id="key" value="supersecret-dev-key" style="width: 320px"
    /></label>
    <label
      >Café ID: <input id="cafeId" value="cafetest-01" style="width: 200px"
    /></label>
    <label
      >TTL seconds: <input id="ttl" value="60" style="width: 80px"
    /></label>
    <button id="issue">Issue QR</button>

    <h2>Result</h2>
    <div id="qr"></div>
    <pre
      id="payload"
      style="
        white-space: pre-wrap;
        background: #f7f7f7;
        padding: 8px;
        border-radius: 6px;
      "
    ></pre>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      const apiEl = document.getElementById("api");
      const keyEl = document.getElementById("key");
      const cafeIdEl = document.getElementById("cafeId");
      const ttlEl = document.getElementById("ttl");
      const issue = document.getElementById("issue");
      const qrDiv = document.getElementById("qr");
      const payloadEl = document.getElementById("payload");

      issue.onclick = async () => {
        qrDiv.innerHTML = "";
        payloadEl.textContent = "Issuing...";
        try {
          const url = apiEl.value.replace(/\/$/, "") + "/qr/issue";
          const cafeId = cafeIdEl.value || "cafetest-01";
          const res = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": keyEl.value,
            },
            body: JSON.stringify({
              cafeId: cafeId,
              ttl: Number(ttlEl.value),
            }),
          });
          const data = await res.json();
          payloadEl.textContent = JSON.stringify(data, null, 2);
          const payload =
            "STAMP:" +
            JSON.stringify({
              cafeId: data.cafeId,
              nonce: data.nonce,
              expires: data.expires,
            });
          new QRCode(qrDiv, { text: payload, width: 300, height: 300 });

          // Auto-copy link for mobile access
          const currentUrl = window.location.href.split("?")[0];
          const mobileLink = `${apiEl.value
            .replace(/\/$/, "")
            .replace(/:\d+$/, "")}/customer.html (or ${currentUrl} on mobile)`;
          console.log("📱 Open on smartphone: " + mobileLink);
        } catch (e) {
          payloadEl.textContent = "Error: " + e.message;
        }
      };
    </script>
  </body>
</html>
