<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaffeekarte Admin – Kartendesign</title>
    <link rel="stylesheet" href="/theme.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--background, var(--color-background));
        color: var(--text);
        font-family: var(--font-sans);
        padding: 32px 16px 60px;
      }

      .wrap {
        max-width: 560px;
        margin: 0 auto;
      }

      h1 {
        font-family: var(--font-display);
        font-size: 1.7rem;
        margin: 0 0 4px;
      }

      .sub {
        color: var(--text-muted);
        font-size: 0.92rem;
        margin: 0 0 24px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px;
        margin-bottom: 18px;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 16px;
      }

      .field:last-child {
        margin-bottom: 0;
      }

      .field label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .field .hint {
        font-size: 0.78rem;
        color: var(--text-muted);
        font-weight: 400;
      }

      .field input[type="text"],
      .field input[type="password"],
      .field input[type="number"],
      .field select,
      .field textarea {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.95rem;
        font-family: inherit;
        background: var(--color-surface-elevated, #fff);
        color: var(--text);
      }

      .field textarea {
        resize: vertical;
        min-height: 70px;
      }

      .logoRow {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .logoPreview {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        border: 1px solid var(--border);
        object-fit: cover;
        background: var(--color-surface-elevated, #fff);
        display: none;
      }

      .stampCirclePreview {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid var(--border);
        object-fit: contain;
        background: #f3ede4;
      }

      .stampSourcePreview {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: 1px solid var(--border);
        object-fit: contain;
        background: var(--color-surface-elevated, #fff);
        display: none;
      }

      .passPreview {
        border-radius: 16px;
        padding: 20px;
        border: 1px solid var(--border);
      }

      .passPreviewHead {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .passPreviewLogo {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        object-fit: contain;
        background: rgba(255, 255, 255, 0.6);
        display: none;
      }

      .passPreviewName {
        font-weight: 700;
        font-size: 0.95rem;
      }

      .passPreviewStamps {
        display: grid;
        gap: 8px;
        margin-top: 18px;
      }

      .passPreviewStamp {
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .passPreviewStamp img {
        width: 82%;
        height: 82%;
        object-fit: contain;
      }

      .passPreviewReward {
        margin-top: 14px;
        font-size: 0.82rem;
        opacity: 0.8;
      }

      .themeGrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .themeSwatch {
        border: 2px solid var(--border);
        border-radius: 10px;
        padding: 10px 8px;
        text-align: center;
        font-size: 0.76rem;
        cursor: pointer;
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }

      .themeSwatch.selected {
        border-color: var(--brand);
        outline: 2px solid var(--brand);
        outline-offset: 1px;
      }

      .colorPickers {
        display: flex;
        gap: 20px;
        margin-top: 12px;
      }

      .colorPickerField {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--text-muted);
        cursor: pointer;
      }

      .colorPickerField input[type="color"] {
        width: 40px;
        height: 32px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        background: none;
      }

      .stampGrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .stampOption {
        border: 2px solid var(--border);
        border-radius: 10px;
        padding: 10px 4px;
        text-align: center;
        font-size: 1.3rem;
        cursor: pointer;
        background: var(--color-surface-elevated, #fff);
      }

      .stampOption.selected {
        border-color: var(--brand);
        outline: 2px solid var(--brand);
        outline-offset: 1px;
      }

      .stampOption .lbl {
        display: block;
        font-size: 0.7rem;
        margin-top: 4px;
        color: var(--text-muted);
      }

      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .saveBtn {
        width: 100%;
      }

      .statusMsg {
        min-height: 1.2em;
        margin-top: 12px;
        font-size: 0.88rem;
        color: var(--color-error);
      }

      .statusMsg[data-ok="true"] {
        color: var(--color-success);
      }

      .hidden {
        display: none !important;
      }

      #standeeLink {
        display: block;
        margin-top: 12px;
        font-weight: 600;
        color: var(--brand);
        text-decoration: none;
      }

      #standeeLink:hover {
        text-decoration: underline;
      }

      #standeeLink.hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Kartendesign (Admin)</h1>
      <p class="sub">
        Für Cafés, die ihr eigenes Kartendesign nicht selbst einrichten
        möchten – hier direkt für sie übernehmen.
      </p>

      <div class="field" style="margin-bottom: 24px">
        <label for="adminToolSelect">Admin-Tool</label>
        <select id="adminToolSelect">
          <option value="/admin-dashboard.html">Dashboard</option>
          <option value="/admin-cafe-design.html" selected>Kartendesign</option>
          <option value="/admin-logo-preview.html">Logo-Vorschau</option>
        </select>
      </div>

      <p class="statusMsg" id="loadStatus"></p>

      <div class="card hidden" id="pickCard">
        <div class="field">
          <label for="cafeSelect">Café auswählen</label>
          <select id="cafeSelect"></select>
        </div>
        <a id="standeeLink" class="hint hidden" href="#" target="_blank" rel="noopener"
          >Aufsteller für dieses Café öffnen →</a
        >
      </div>

      <div class="card hidden" id="formCard">
        <div class="field">
          <label>Vorschau <span class="hint">(so sieht der Wallet-Pass bei den Gästen aus)</span></label>
          <div id="passPreview" class="passPreview">
            <div class="passPreviewHead">
              <img id="passPreviewLogo" class="passPreviewLogo" alt="" />
              <span id="passPreviewName" class="passPreviewName"></span>
            </div>
            <div id="passPreviewStamps" class="passPreviewStamps"></div>
            <div id="passPreviewReward" class="passPreviewReward"></div>
          </div>
        </div>

        <div class="field">
          <label for="logoInput"
            >Logo <span class="hint">(quadratisch wirkt am besten)</span></label
          >
          <div class="logoRow">
            <img class="logoPreview" id="logoPreview" alt="" />
            <input id="logoInput" type="file" accept="image/*" />
          </div>
        </div>

        <div class="field">
          <label
            >Kartenfarbe
            <span class="hint">(Vorlagen als Schnellauswahl, oder frei wählen)</span></label
          >
          <div class="themeGrid" id="themeGrid"></div>
          <div class="colorPickers">
            <label class="colorPickerField">
              <span>Hintergrund</span>
              <input id="bgColorInput" type="color" />
            </label>
            <label class="colorPickerField">
              <span>Text/Symbole</span>
              <input id="fgColorInput" type="color" />
            </label>
          </div>
        </div>

        <div class="field">
          <label>Stempel-Symbol</label>
          <div class="stampGrid" id="stampGrid"></div>
        </div>

        <div class="field">
          <label for="circleStyleSelect">Stempel-Kreise</label>
          <select id="circleStyleSelect">
            <option value="white">Weiß</option>
            <option value="background">In Hintergrundfarbe</option>
          </select>
        </div>

        <div class="field">
          <label
            >Stempel-Vorlage
            <span class="hint">(statt der Kaffeebohne das Logo oder ein eigenes Symbol stempeln)</span></label
          >
          <div class="logoRow">
            <img class="stampCirclePreview" id="stampPreview" alt="" />
            <input id="stampSourceInput" type="file" accept="image/*" />
            <img class="stampSourcePreview" id="stampSourcePreview" alt="" />
          </div>
          <label class="colorPickerField" style="margin-top: 10px">
            <input id="stampInvertInput" type="checkbox" />
            <span>Farben umkehren (für helles Symbol auf dunklem Hintergrund)</span>
          </label>
          <div style="display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap">
            <button class="btn secondary" id="stampGenerateBtn" type="button">
              Stempel-Vorlage erzeugen
            </button>
            <button class="btn secondary hidden" id="stampResetBtn" type="button">
              Zurücksetzen (Kaffeebohne)
            </button>
          </div>
          <p class="statusMsg" id="stampStatusMsg" style="color: var(--text-muted)"></p>
        </div>

        <div class="row2">
          <div class="field">
            <label for="stampsForReward">Stempel bis zur Prämie</label>
            <input id="stampsForReward" type="number" min="1" max="50" />
          </div>
          <div class="field">
            <label for="rewardDescription">Prämie</label>
            <input id="rewardDescription" type="text" placeholder="z. B. 1 Kaffee aufs Haus" />
          </div>
        </div>

        <div class="field">
          <label for="cardBackText"
            >Text auf der Karte
            <span class="hint">(z. B. Öffnungszeiten, Hinweise, Gruß)</span></label
          >
          <textarea id="cardBackText" maxlength="400"></textarea>
        </div>

        <button class="btn primary saveBtn" id="saveBtn" type="button">
          Speichern
        </button>
        <p class="statusMsg" id="statusMsg"></p>
      </div>
    </div>

    <script>
      (function () {
        var THEMES = [
          { id: "paper", label: "Warm White", bg: "#f7efe1", fg: "#171412" },
          { id: "clean", label: "Bright White", bg: "#ffffff", fg: "#131313" },
          { id: "ink", label: "Dark", bg: "#201811", fg: "#f4e9da" },
          { id: "brand", label: "Espresso", bg: "#6b452c", fg: "#ffffff" },
          { id: "latte", label: "Soft Cream", bg: "#ecd7b4", fg: "#211a15" },
          { id: "mono", label: "Mono", bg: "#eef0ee", fg: "#111111" },
        ];

        var STAMP_STYLES = [
          { id: "bean", label: "Bohne", symbol: "☕" },
          { id: "star", label: "Stern", symbol: "★" },
          { id: "circle", label: "Kreis", symbol: "●" },
        ];

        var refs = {
          pickCard: document.getElementById("pickCard"),
          formCard: document.getElementById("formCard"),
          loadStatus: document.getElementById("loadStatus"),
          cafeSelect: document.getElementById("cafeSelect"),
          standeeLink: document.getElementById("standeeLink"),
          logoInput: document.getElementById("logoInput"),
          logoPreview: document.getElementById("logoPreview"),
          themeGrid: document.getElementById("themeGrid"),
          bgColorInput: document.getElementById("bgColorInput"),
          fgColorInput: document.getElementById("fgColorInput"),
          stampGrid: document.getElementById("stampGrid"),
          circleStyleSelect: document.getElementById("circleStyleSelect"),
          stampPreview: document.getElementById("stampPreview"),
          stampSourceInput: document.getElementById("stampSourceInput"),
          stampSourcePreview: document.getElementById("stampSourcePreview"),
          stampInvertInput: document.getElementById("stampInvertInput"),
          stampGenerateBtn: document.getElementById("stampGenerateBtn"),
          stampResetBtn: document.getElementById("stampResetBtn"),
          stampStatusMsg: document.getElementById("stampStatusMsg"),
          stampsForReward: document.getElementById("stampsForReward"),
          rewardDescription: document.getElementById("rewardDescription"),
          cardBackText: document.getElementById("cardBackText"),
          saveBtn: document.getElementById("saveBtn"),
          statusMsg: document.getElementById("statusMsg"),
          passPreview: document.getElementById("passPreview"),
          passPreviewLogo: document.getElementById("passPreviewLogo"),
          passPreviewName: document.getElementById("passPreviewName"),
          passPreviewStamps: document.getElementById("passPreviewStamps"),
          passPreviewReward: document.getElementById("passPreviewReward"),
        };

        var state = {
          cafes: [],
          selectedCafeId: null,
          selectedTheme: "paper",
          selectedStampStyle: "bean",
          pendingLogoDataUrl: undefined, // undefined = unchanged
          pendingStampSourceDataUrl: undefined, // optional symbol distinct from the logo
          loadedLogoDataUrl: null, // the cafe's already-saved logo, once loaded
          hasCustomStampIcon: false,
          stampIconVersion: 0, // cache-bust the stamp-icon.png preview after generate/reset
        };

        function themeHex(themeId) {
          var t = THEMES.filter(function (x) {
            return x.id === themeId;
          })[0];
          return t || THEMES[0];
        }

        function renderThemeGrid() {
          refs.themeGrid.innerHTML = "";
          THEMES.forEach(function (t) {
            var el = document.createElement("div");
            el.className =
              "themeSwatch" + (t.id === state.selectedTheme ? " selected" : "");
            el.style.background = t.bg;
            el.style.color = t.fg;
            el.textContent = t.label;
            el.addEventListener("click", function () {
              state.selectedTheme = t.id;
              refs.bgColorInput.value = t.bg;
              refs.fgColorInput.value = t.fg;
              renderThemeGrid();
              renderPassPreview();
            });
            refs.themeGrid.appendChild(el);
          });
        }

        function renderStampGrid() {
          refs.stampGrid.innerHTML = "";
          STAMP_STYLES.forEach(function (s) {
            var el = document.createElement("div");
            el.className =
              "stampOption" +
              (s.id === state.selectedStampStyle ? " selected" : "");
            el.innerHTML = s.symbol + '<span class="lbl">' + s.label + "</span>";
            el.addEventListener("click", function () {
              state.selectedStampStyle = s.id;
              renderStampGrid();
              renderPassPreview();
            });
            refs.stampGrid.appendChild(el);
          });
        }

        function loadCafeList() {
          return fetch("/api/admin/cafes/activity?eventsLimit=1&customerLimit=1")
            .then(function (res) {
              if (res.status === 401) throw new Error("unauthorized");
              return res.json();
            })
            .then(function (data) {
              state.cafes = (data && data.cafes) || [];
              refs.cafeSelect.innerHTML = "";
              state.cafes
                .slice()
                .sort(function (a, b) {
                  return (a.name || "").localeCompare(b.name || "");
                })
                .forEach(function (c) {
                  var opt = document.createElement("option");
                  opt.value = String(c.id);
                  opt.textContent = c.name || "Café " + c.id;
                  refs.cafeSelect.appendChild(opt);
                });
            });
        }

        function updateStandeeLink(cafeAddress) {
          if (!cafeAddress) {
            refs.standeeLink.classList.add("hidden");
            return;
          }
          refs.standeeLink.href =
            "/aufsteller?cafeAddress=" + encodeURIComponent(cafeAddress);
          refs.standeeLink.classList.remove("hidden");
        }

        // Stempel-Vorlage preview/button state - a logo (just-picked or
        // already-saved) or a separately-picked symbol is required before
        // "erzeugen" makes sense; the reset button only matters once a
        // custom icon actually exists.
        function renderStampSection() {
          state.stampIconVersion = Date.now();
          refs.stampPreview.src =
            "/api/cafes/" + state.selectedCafeId + "/stamp-icon.png?v=" + state.stampIconVersion;
          var sourceAvailable = !!(
            state.pendingStampSourceDataUrl ||
            state.pendingLogoDataUrl ||
            state.loadedLogoDataUrl
          );
          refs.stampGenerateBtn.disabled = !sourceAvailable;
          refs.stampResetBtn.classList.toggle("hidden", !state.hasCustomStampIcon);
          refs.stampStatusMsg.textContent = !sourceAvailable
            ? "Zuerst ein Logo oder Symbol hochladen."
            : state.hasCustomStampIcon
              ? "Eigene Stempel-Vorlage aktiv."
              : "Noch die Standard-Kaffeebohne.";
          renderPassPreview();
        }

        // Live preview of the actual wallet pass: same color/logo/stamp-
        // style inputs as the form above, re-rendered on every change so an
        // admin can see the effect immediately instead of guessing from the
        // raw field values (chat 2026-10-02). Deliberately a simplified
        // standalone card, not a reuse of cafe-scanner-new.html's full
        // preview system - this tool only ever shows one café at a time and
        // doesn't need that system's multi-theme CSS variables.
        function renderPassPreview() {
          var bg = refs.bgColorInput.value || "#f7efe1";
          var fg = refs.fgColorInput.value || "#171412";
          refs.passPreview.style.background = bg;
          refs.passPreview.style.color = fg;
          refs.passPreview.style.borderColor = fg;

          var logoSrc = state.pendingLogoDataUrl || state.loadedLogoDataUrl;
          if (logoSrc) {
            refs.passPreviewLogo.src = logoSrc;
            refs.passPreviewLogo.style.display = "block";
          } else {
            refs.passPreviewLogo.style.display = "none";
            refs.passPreviewLogo.src = "";
          }

          var selectedOption =
            refs.cafeSelect.options[refs.cafeSelect.selectedIndex];
          refs.passPreviewName.textContent = selectedOption
            ? selectedOption.textContent
            : "Dein Café";

          var threshold = Math.max(
            1,
            Math.min(50, Number(refs.stampsForReward.value) || 10),
          );
          var filled = Math.min(threshold, Math.round(threshold * 0.6));
          var circleFill =
            refs.circleStyleSelect.value === "background" ? bg : "#ffffff";
          var stampSym =
            STAMP_STYLES.filter(function (s) {
              return s.id === state.selectedStampStyle;
            })[0] || STAMP_STYLES[0];
          var iconUrl =
            state.selectedCafeId != null
              ? "/api/cafes/" +
                state.selectedCafeId +
                "/stamp-icon.png?v=" +
                state.stampIconVersion
              : "";

          var rows = threshold <= 5 ? 1 : 2;
          var cols = Math.ceil(threshold / rows);
          refs.passPreviewStamps.style.gridTemplateColumns =
            "repeat(" + cols + ", 1fr)";

          refs.passPreviewStamps.innerHTML = "";
          for (var i = 0; i < threshold; i++) {
            var dot = document.createElement("div");
            dot.className = "passPreviewStamp";
            dot.style.border = "1.5px solid " + fg;
            dot.style.background = circleFill;
            if (i < filled) {
              dot.innerHTML =
                stampSym.id === "bean"
                  ? '<img src="' + iconUrl + '" alt="" />'
                  : '<span style="font-size: 1.1rem">' + stampSym.symbol + "</span>";
            }
            refs.passPreviewStamps.appendChild(dot);
          }

          var remaining = Math.max(0, threshold - filled);
          var reward = refs.rewardDescription.value.trim() || "deine Prämie";
          refs.passPreviewReward.textContent =
            remaining > 0
              ? "Noch " + remaining + " Stempel bis: " + reward
              : "Prämie verfügbar: " + reward;
        }

        function loadCafeProfile(cafeId) {
          return fetch("/api/admin/cafes/" + encodeURIComponent(cafeId) + "/profile")
            .then(function (res) {
              return res.json().then(function (data) {
                return { ok: res.ok, data: data };
              });
            })
            .then(function (result) {
              if (!result.ok) throw new Error("Café konnte nicht geladen werden.");
              var cafe = result.data.cafe;
              updateStandeeLink(cafe.address);
              state.pendingLogoDataUrl = undefined;
              state.selectedTheme = cafe.cardTheme || "paper";
              var presetColors = themeHex(state.selectedTheme);
              refs.bgColorInput.value = cafe.cardBgColor || presetColors.bg;
              refs.fgColorInput.value = cafe.cardFgColor || presetColors.fg;
              state.selectedStampStyle =
                (cafe.program && cafe.program.stampStyle) || "bean";
              refs.stampsForReward.value =
                (cafe.program && cafe.program.stampsForReward) || 10;
              refs.rewardDescription.value =
                (cafe.program && cafe.program.rewardDescription) || "";
              refs.cardBackText.value = cafe.cardBackText || "";
              state.loadedLogoDataUrl = cafe.logoDataUrl || null;
              if (cafe.logoDataUrl) {
                refs.logoPreview.src = cafe.logoDataUrl;
                refs.logoPreview.style.display = "block";
              } else {
                refs.logoPreview.style.display = "none";
                refs.logoPreview.src = "";
              }
              refs.circleStyleSelect.value = cafe.stampCircleStyle || "white";
              state.pendingStampSourceDataUrl = undefined;
              state.hasCustomStampIcon = !!cafe.hasCustomStampIcon;
              refs.stampSourcePreview.style.display = "none";
              refs.stampSourcePreview.src = "";
              renderThemeGrid();
              renderStampGrid();
              renderStampSection();
            });
        }

        function init() {
          refs.loadStatus.textContent = "Lade Cafés …";
          loadCafeList()
            .then(function () {
              refs.loadStatus.textContent = "";
              refs.pickCard.classList.remove("hidden");
              refs.formCard.classList.remove("hidden");
              if (state.cafes.length) {
                state.selectedCafeId = state.cafes[0].id;
                refs.cafeSelect.value = String(state.selectedCafeId);
                return loadCafeProfile(state.selectedCafeId);
              }
            })
            .catch(function () {
              // Only reachable if this page is somehow loaded without going
              // through Caddy's basic_auth + x-admin-key injection (e.g.
              // hitting the api service directly) - there's no key to type
              // here that would fix it, the page just needs the real route.
              refs.loadStatus.textContent =
                "Cafés konnten nicht geladen werden. Diese Seite muss über die geschützte Admin-URL aufgerufen werden.";
            });
        }

        refs.cafeSelect.addEventListener("change", function () {
          state.selectedCafeId = Number(refs.cafeSelect.value);
          loadCafeProfile(state.selectedCafeId);
        });

        [
          refs.bgColorInput,
          refs.fgColorInput,
          refs.circleStyleSelect,
          refs.stampsForReward,
          refs.rewardDescription,
        ].forEach(function (el) {
          el.addEventListener("input", renderPassPreview);
          el.addEventListener("change", renderPassPreview);
        });

        refs.logoInput.addEventListener("change", function () {
          var file = refs.logoInput.files && refs.logoInput.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            state.pendingLogoDataUrl = String(reader.result);
            refs.logoPreview.src = state.pendingLogoDataUrl;
            refs.logoPreview.style.display = "block";

            // Pre-fill the custom color pickers from the logo's own
            // dominant color (same detection /admin-logo-preview.html
            // uses) - the admin can still fine-tune or pick a preset
            // afterwards, this is just a starting point.
            fetch("/api/admin/logo-colors", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ logoDataUrl: state.pendingLogoDataUrl }),
            })
              .then(function (res) {
                return res.json();
              })
              .then(function (data) {
                if (data && data.ok) {
                  refs.bgColorInput.value = data.bgColor;
                  refs.fgColorInput.value = data.fgColor;
                  state.selectedTheme = null;
                  renderThemeGrid();
                }
              })
              .catch(function () {});
            renderStampSection();
          };
          reader.readAsDataURL(file);
        });

        refs.stampSourceInput.addEventListener("change", function () {
          var file = refs.stampSourceInput.files && refs.stampSourceInput.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function () {
            state.pendingStampSourceDataUrl = String(reader.result);
            refs.stampSourcePreview.src = state.pendingStampSourceDataUrl;
            refs.stampSourcePreview.style.display = "block";
            renderStampSection();
          };
          reader.readAsDataURL(file);
        });

        refs.stampGenerateBtn.addEventListener("click", function () {
          if (!state.selectedCafeId) return;
          var source =
            state.pendingStampSourceDataUrl ||
            state.pendingLogoDataUrl ||
            state.loadedLogoDataUrl;
          if (!source) return;
          refs.stampGenerateBtn.disabled = true;
          refs.stampStatusMsg.textContent = "Wird erzeugt …";
          fetch(
            "/api/admin/cafes/" +
              encodeURIComponent(state.selectedCafeId) +
              "/stamp-icon/generate",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                logoDataUrl: source,
                invert: !!refs.stampInvertInput.checked,
              }),
            },
          )
            .then(function (res) {
              return res.json().then(function (data) {
                return { ok: res.ok, data: data };
              });
            })
            .then(function (result) {
              if (!result.ok || result.data.ok === false) {
                throw new Error(
                  (result.data && result.data.error) ||
                    "Stempel-Vorlage konnte nicht erzeugt werden.",
                );
              }
              state.hasCustomStampIcon = true;
              renderStampSection();
            })
            .catch(function (err) {
              refs.stampStatusMsg.textContent =
                err.message || "Stempel-Vorlage konnte nicht erzeugt werden.";
            })
            .then(function () {
              refs.stampGenerateBtn.disabled = false;
            });
        });

        refs.stampResetBtn.addEventListener("click", function () {
          if (!state.selectedCafeId) return;
          refs.stampResetBtn.disabled = true;
          fetch(
            "/api/admin/cafes/" +
              encodeURIComponent(state.selectedCafeId) +
              "/stamp-icon",
            { method: "DELETE" },
          )
            .then(function (res) {
              return res.json().then(function (data) {
                return { ok: res.ok, data: data };
              });
            })
            .then(function (result) {
              if (!result.ok) {
                throw new Error("Zurücksetzen fehlgeschlagen.");
              }
              state.hasCustomStampIcon = false;
              renderStampSection();
            })
            .catch(function (err) {
              refs.stampStatusMsg.textContent =
                err.message || "Zurücksetzen fehlgeschlagen.";
            })
            .then(function () {
              refs.stampResetBtn.disabled = false;
            });
        });

        refs.saveBtn.addEventListener("click", function () {
          if (!state.selectedCafeId) return;
          refs.statusMsg.textContent = "Speichern …";
          refs.statusMsg.removeAttribute("data-ok");

          var body = {
            cardTheme: state.selectedTheme,
            cardBgColor: refs.bgColorInput.value,
            cardFgColor: refs.fgColorInput.value,
            stampStyle: state.selectedStampStyle,
            stampCircleStyle: refs.circleStyleSelect.value,
            stampsForReward: Number(refs.stampsForReward.value) || 10,
            rewardDescription: refs.rewardDescription.value.trim(),
            cardBackText: refs.cardBackText.value.trim(),
          };
          if (state.pendingLogoDataUrl !== undefined) {
            body.logoDataUrl = state.pendingLogoDataUrl;
          }

          fetch(
            "/api/admin/cafes/" + encodeURIComponent(state.selectedCafeId) + "/profile",
            {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            },
          )
            .then(function (res) {
              return res.json().then(function (data) {
                return { ok: res.ok, data: data };
              });
            })
            .then(function (result) {
              if (!result.ok) {
                throw new Error(
                  (result.data && result.data.error) || "Speichern fehlgeschlagen.",
                );
              }
              refs.statusMsg.setAttribute("data-ok", "true");
              refs.statusMsg.textContent = "Gespeichert.";
              state.pendingLogoDataUrl = undefined;
            })
            .catch(function (err) {
              refs.statusMsg.textContent = err.message || "Speichern fehlgeschlagen.";
              refs.statusMsg.removeAttribute("data-ok");
            });
        });

        var adminToolSelect = document.getElementById("adminToolSelect");
        if (adminToolSelect) {
          adminToolSelect.addEventListener("change", function () {
            window.location.href = adminToolSelect.value;
          });
        }

        renderThemeGrid();
        renderStampGrid();
        init();
      })();
    </script>
  </body>
</html>
