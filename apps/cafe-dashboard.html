<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>☕ Café Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .header {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 20px 30px;
        margin-bottom: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .cafe-info {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 20px;
      }
      .cafe-name {
        font-size: 24px;
        font-weight: 700;
        color: #1a202c;
      }
      .nav-buttons {
        display: flex;
        gap: 12px;
      }
      .btn {
        padding: 12px 20px;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-block;
      }
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .btn-secondary {
        background: white;
        color: #667eea;
        border: 2px solid #667eea;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }
      .stat-label {
        font-size: 14px;
        color: #718096;
        font-weight: 600;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .stat-value {
        font-size: 36px;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .stat-subtitle {
        font-size: 12px;
        color: #a0aec0;
        margin-top: 4px;
      }
      .history-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }
      .history-title {
        font-size: 20px;
        font-weight: 700;
        color: #1a202c;
        margin-bottom: 20px;
      }
      .history-table {
        width: 100%;
        border-collapse: collapse;
      }
      .history-table th {
        text-align: left;
        font-size: 12px;
        color: #718096;
        font-weight: 600;
        text-transform: uppercase;
        padding: 12px;
        border-bottom: 2px solid #e2e8f0;
      }
      .history-table td {
        padding: 16px 12px;
        border-bottom: 1px solid #f7fafc;
        font-size: 14px;
        color: #2d3748;
      }
      .history-table tr:hover {
        background: #f7fafc;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge-success {
        background: #d1fae5;
        color: #065f46;
      }
      .badge-redemption {
        background: #fef3c7;
        color: #92400e;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: white;
        font-size: 18px;
      }
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #718096;
      }
      .empty-icon {
        font-size: 64px;
        margin-bottom: 16px;
      }
      @media (max-width: 768px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }
        .history-table {
          font-size: 12px;
        }
        .history-table td,
        .history-table th {
          padding: 10px 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="cafe-info">
          <div class="avatar" id="cafeAvatar">☕</div>
          <div>
            <div class="cafe-name" id="cafeName">Café Dashboard</div>
          </div>
        </div>
        <div class="nav-buttons">
          <a href="./cafe-scanner.html" class="btn btn-primary">📷 Scanner</a>
          <button class="btn btn-secondary" onclick="logout()">Abmelden</button>
        </div>
      </div>

      <div id="loading" class="loading">Lade Dashboard...</div>

      <div id="dashboard" style="display: none">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Gesamt Stempel</div>
            <div class="stat-value" id="totalStamps">0</div>
            <div class="stat-subtitle">Alle Zeit</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Kunden</div>
            <div class="stat-value" id="uniqueCustomers">0</div>
            <div class="stat-subtitle">Einzigartige Kunden</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Heute</div>
            <div class="stat-value" id="todayStamps">0</div>
            <div class="stat-subtitle">Stempel heute</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Belohnungen</div>
            <div class="stat-value" id="totalRedemptions">0</div>
            <div class="stat-subtitle">Eingelöst</div>
          </div>
        </div>

        <div class="history-card">
          <div class="history-title">📊 Letzte Aktivitäten</div>
          <div id="historyContainer">
            <table class="history-table">
              <thead>
                <tr>
                  <th>Zeit</th>
                  <th>Kunde</th>
                  <th>Anzahl</th>
                  <th>Typ</th>
                  <th>Transaktion</th>
                </tr>
              </thead>
              <tbody id="historyBody">
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      const apiBase = "http://192.168.0.175:3000";
      let cafe = null;

      async function init() {
        try {
          // Check if logged in
          const saved = localStorage.getItem("cafe_session");
          if (!saved) {
            window.location.href = "./cafe-scanner.html";
            return;
          }

          cafe = JSON.parse(saved);

          // Update UI
          document.getElementById("cafeAvatar").textContent = (cafe.name || "C")
            .charAt(0)
            .toUpperCase();
          document.getElementById("cafeName").textContent =
            cafe.name || "Café Dashboard";

          // Load stats
          await loadStats();
          await loadHistory();

          document.getElementById("loading").style.display = "none";
          document.getElementById("dashboard").style.display = "block";

          // Refresh every 30 seconds
          setInterval(async () => {
            await loadStats();
            await loadHistory();
          }, 30000);
        } catch (err) {
          console.error("Init error:", err);
          document.getElementById(
            "loading"
          ).innerHTML = `<div style="color: white;">Fehler: ${err.message}</div>`;
        }
      }

      async function loadStats() {
        try {
          // Get all stamp events for this café
          const res = await fetch(`${apiBase}/cafes/${cafe.id}/stats`, {
            headers: { "x-api-key": cafe.apiKey },
          });

          if (!res.ok) {
            // Fallback: calculate from history
            const historyRes = await fetch(`${apiBase}/stamps/history`);
            const allHistory = await historyRes.json();

            const cafeHistory = allHistory.filter(
              (h) =>
                h.cafe &&
                cafe.address &&
                h.cafe.toLowerCase() === cafe.address.toLowerCase()
            );

            const totalStamps = cafeHistory.length;
            const uniqueCustomers = new Set(
              cafeHistory.map((h) => h.user.toLowerCase())
            ).size;

            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStamps = cafeHistory.filter(
              (h) => h.ts >= today.getTime()
            ).length;

            // Count redemptions (transactions with "REDEMPTION_" prefix)
            const totalRedemptions = cafeHistory.filter(
              (h) => h.txhash && h.txhash.startsWith("REDEMPTION_")
            ).length;

            document.getElementById("totalStamps").textContent = totalStamps;
            document.getElementById("uniqueCustomers").textContent =
              uniqueCustomers;
            document.getElementById("todayStamps").textContent = todayStamps;
            document.getElementById("totalRedemptions").textContent =
              totalRedemptions;

            return;
          }

          const stats = await res.json();
          document.getElementById("totalStamps").textContent =
            stats.totalStamps || 0;
          document.getElementById("uniqueCustomers").textContent =
            stats.uniqueCustomers || 0;
          document.getElementById("todayStamps").textContent =
            stats.todayStamps || 0;
          document.getElementById("totalRedemptions").textContent =
            stats.totalRedemptions || 0;
        } catch (err) {
          console.error("Failed to load stats:", err);
        }
      }

      async function loadHistory() {
        try {
          const res = await fetch(`${apiBase}/stamps/history`);
          const allHistory = await res.json();

          // Filter for this café
          const cafeHistory = allHistory
            .filter(
              (h) =>
                h.cafe &&
                cafe.address &&
                h.cafe.toLowerCase() === cafe.address.toLowerCase()
            )
            .sort((a, b) => b.ts - a.ts)
            .slice(0, 50); // Last 50 events

          const tbody = document.getElementById("historyBody");

          if (cafeHistory.length === 0) {
            tbody.innerHTML = `
            <tr>
              <td colspan="5" style="text-align: center; padding: 40px; color: #a0aec0;">
                <div style="font-size: 48px; margin-bottom: 16px;">📊</div>
                <div>Noch keine Aktivitäten</div>
              </td>
            </tr>
          `;
            return;
          }

          tbody.innerHTML = cafeHistory
            .map((h) => {
              const date = new Date(h.ts);
              const time = date.toLocaleString("de-DE", {
                day: "2-digit",
                month: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
              });

              const isRedemption =
                h.txhash && h.txhash.startsWith("REDEMPTION_");
              const badge = isRedemption
                ? '<span class="badge badge-redemption">🎁 Belohnung</span>'
                : '<span class="badge badge-success">☕ Stempel</span>';

              const customerName =
                h.customer_name || h.user.slice(0, 8) + "...";
              const txLink =
                h.txhash && !isRedemption
                  ? `<a href="https://sepolia.etherscan.io/tx/${
                      h.txhash
                    }" target="_blank" style="color: #667eea; text-decoration: none;">${h.txhash.slice(
                      0,
                      8
                    )}...</a>`
                  : isRedemption
                  ? "—"
                  : h.txhash
                  ? h.txhash.slice(0, 8) + "..."
                  : "—";

              return `
            <tr>
              <td>${time}</td>
              <td><strong>${customerName}</strong></td>
              <td>${isRedemption ? "10" : "1"}</td>
              <td>${badge}</td>
              <td>${txLink}</td>
            </tr>
          `;
            })
            .join("");
        } catch (err) {
          console.error("Failed to load history:", err);
        }
      }

      function logout() {
        if (confirm("Möchtest du dich wirklich abmelden?")) {
          localStorage.removeItem("cafe_session");
          window.location.href = "./cafe-scanner.html";
        }
      }

      init();
    </script>
  </body>
</html>
