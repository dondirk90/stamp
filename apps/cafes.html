<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Kaffeekarte – Café auswählen</title>
    <meta
      name="description"
      content="Wähle dein Café und hol dir die Stempelkarte direkt in Apple Wallet oder Google Wallet – ohne App-Download."
    />
    <link rel="stylesheet" href="/theme.css?v=20260712b" />
    <style>
      :root {
        --page-max: 720px;
        --line: rgba(81, 58, 40, 0.12);
      }

      body {
        min-height: 100svh;
        background: var(--color-background);
        color: var(--text);
      }

      .page {
        width: min(var(--page-max), calc(100% - 28px));
        margin: 0 auto;
        padding: calc(28px + var(--safe-top, 0px)) 0 56px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        margin-bottom: clamp(36px, 7vw, 64px);
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        color: inherit;
        text-decoration: none;
      }

      .brandMark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(255, 252, 248, 0.96), rgba(247, 239, 229, 0.9));
        box-shadow:
          0 14px 30px rgba(68, 41, 22, 0.08),
          0 1px 0 rgba(255, 255, 255, 0.88) inset;
      }

      .brandMark img {
        width: 28px;
        height: 28px;
        object-fit: contain;
      }

      .brandText {
        display: grid;
        gap: 3px;
      }

      .brandKicker {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(59, 42, 31, 0.62);
      }

      .brandWord {
        font-family: var(--font-serif);
        font-size: 34px;
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      .sectionKicker {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(59, 42, 31, 0.62);
      }

      h1 {
        margin: 10px 0 0;
        font-family: var(--font-serif);
        font-size: clamp(36px, 5.4vw, 52px);
        line-height: 0.98;
        letter-spacing: -0.05em;
      }

      .lead {
        margin: 14px 0 0;
        max-width: 46ch;
        font-size: 17px;
        line-height: 1.6;
        color: rgba(59, 42, 31, 0.8);
      }

      .cafeList {
        margin-top: clamp(28px, 5vw, 44px);
        display: grid;
        gap: 6px;
      }

      .cafeRow {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px;
        border-radius: 18px;
        text-decoration: none;
        color: inherit;
        border: 1px solid transparent;
      }

      .cafeRow:hover {
        background: rgba(81, 58, 40, 0.06);
        border-color: var(--line);
      }

      .cafeLogo {
        width: 52px;
        height: 52px;
        flex: none;
        border-radius: 14px;
        background: rgba(81, 58, 40, 0.08);
        display: grid;
        place-items: center;
        overflow: hidden;
        font-size: 22px;
      }

      .cafeLogo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .cafeName {
        margin: 0;
        font-weight: 800;
        font-size: 17px;
      }

      .cafeAddress {
        margin: 2px 0 0;
        font-size: 14px;
        color: rgba(59, 42, 31, 0.66);
      }

      .listStatus {
        margin-top: clamp(28px, 5vw, 44px);
        color: rgba(59, 42, 31, 0.66);
        font-size: 15px;
      }

      .footerLinks {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: clamp(40px, 7vw, 64px);
        padding-top: 22px;
        border-top: 1px solid var(--line);
      }

      .footerLinks a {
        color: rgba(59, 42, 31, 0.72);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
      }

      @media (max-width: 560px) {
        .page {
          width: min(100% - 20px, var(--page-max));
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <a class="brand" href="/">
          <span class="brandMark" aria-hidden="true">
            <img src="/assets/stamp-bean.png?v=1" alt="" />
          </span>
          <span class="brandText">
            <span class="brandKicker">Kaffee im Veedel</span>
            <span class="brandWord">Kaffeekarte</span>
          </span>
        </a>
      </header>

      <div class="sectionKicker">Café auswählen</div>
      <h1>Deine Stempelkarte, in wenigen Sekunden.</h1>
      <p class="lead">
        Wähle dein Café – die Stempelkarte landet direkt in Apple Wallet
        oder Google Wallet, kein App-Download nötig.
      </p>

      <div class="cafeList" id="cafeList"></div>
      <p class="listStatus" id="listStatus">Cafés werden geladen …</p>

      <div class="footerLinks" aria-label="Weitere Seiten">
        <a href="/">Startseite</a>
        <a href="/fuer-cafes">Für Cafés</a>
        <a href="/impressum">Impressum</a>
        <a href="/datenschutz">Datenschutz</a>
      </div>
    </div>

    <script>
      (function () {
        function escapeHtml(value) {
          return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        var listEl = document.getElementById("cafeList");
        var statusEl = document.getElementById("listStatus");

        function renderRow(cafe) {
          if (!cafe || !cafe.cafeAddress) return "";
          var href = "/cafe-join?cafe=" + encodeURIComponent(cafe.cafeAddress);
          var logo = cafe.logoDataUrl
            ? '<img src="' + escapeHtml(cafe.logoDataUrl) + '" alt="" />'
            : "☕";
          var addressLine = cafe.address
            ? '<p class="cafeAddress">' + escapeHtml(cafe.address) + "</p>"
            : "";
          return (
            '<a class="cafeRow" href="' + escapeHtml(href) + '">' +
            '<span class="cafeLogo">' + logo + "</span>" +
            "<span>" +
            '<p class="cafeName">' + escapeHtml(cafe.name || "Café") + "</p>" +
            addressLine +
            "</span>" +
            "</a>"
          );
        }

        fetch("/api/cafes/public", { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("cafes_http_" + res.status);
            return res.json();
          })
          .then(function (payload) {
            // /api/cafes/public already excludes internal test/demo cafés
            // server-side, only a has-a-name sanity check is left to do here.
            var cafes = Array.isArray(payload && payload.cafes)
              ? payload.cafes.filter(function (cafe) {
                  return !!(cafe && String(cafe.name || "").trim());
                })
              : [];

            if (!cafes.length) {
              statusEl.textContent = "Aktuell sind noch keine Cafés verfügbar.";
              return;
            }

            listEl.innerHTML = cafes.map(renderRow).join("");
            statusEl.textContent = "";
          })
          .catch(function () {
            statusEl.textContent =
              "Cafés konnten nicht geladen werden. Bitte versuche es später erneut.";
          });
      })();
    </script>
  </body>
</html>
