<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Stamp — Café QR Issuer</title>
    <link rel="stylesheet" href="/theme.css" />
    <script src="/ui.js"></script>
    <style>
      body {
        min-height: 100vh;
        padding: calc(var(--space-5) + var(--safe-top, 0px))
          calc(var(--space-5) + var(--safe-right, 0px))
          calc(var(--space-5) + var(--safe-bottom, 0px))
          calc(var(--space-5) + var(--safe-left, 0px));
      }

      .issuerShell {
        max-width: 920px;
        margin: 0 auto;
      }

      .issuerTop {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--space-3);
        flex-wrap: wrap;
        padding: var(--space-4) 0;
        margin-bottom: var(--space-4);
      }

      .issuerTitle {
        margin: 0;
        font-size: 18px;
        font-weight: 950;
        letter-spacing: -0.01em;
      }

      .issuerSubtitle {
        margin-top: 4px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .issuerContent {
        display: flex;
        flex-direction: column;
        gap: var(--space-5);
      }

      .section {
        padding: 0;
        border: none;
        background: transparent;
      }

      .section + .section {
        padding-top: var(--space-5);
        border-top: 1px solid var(--border);
      }

      .section h3 {
        margin: 0 0 var(--space-3) 0;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
      }

      .form-group {
        margin-bottom: var(--space-3);
      }

      .label {
        display: block;
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 6px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .qr-section {
        text-align: left;
      }

      .qr-box {
        background: transparent;
        border: none;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        padding: var(--space-5) 0;
        min-height: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-bottom: var(--space-3);
        position: relative;
      }

      #qr canvas {
        max-width: 100%;
        height: auto;
      }

      .payload-box {
        background: transparent;
        border: none;
        border-top: 1px solid var(--border);
        padding: var(--space-3) 0 0;
        font-family: var(--font-mono);
        font-size: 12px;
        max-height: 220px;
        overflow-y: auto;
        word-break: break-word;
        white-space: pre-wrap;
      }

      .status {
        margin-top: var(--space-3);
      }

      /* Keep status readable but frameless */
      .status.info,
      .status.success,
      .status.error,
      .status.loading {
        padding: 0;
        border: none;
        background: transparent;
        font-size: 13px;
        color: var(--text-muted);
      }

      .issuerRow {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
        align-items: flex-start;
      }

      .issuerRow > * {
        flex: 1;
        min-width: 220px;
      }

      .btnPrimary {
        width: 100%;
        padding: 12px 14px;
        font-weight: 900;
      }

      .btnTight {
        width: auto;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body class="theme-invert">
    <div class="issuerShell">
      <div class="issuerTop">
        <div>
          <h1 class="issuerTitle">Café QR Issuer</h1>
          <div class="issuerSubtitle">
            QR generieren, Kunden scannen, Stempel vergeben.
          </div>
        </div>
        <div class="issuerSubtitle">Tool für internes Testing.</div>
      </div>

      <div class="issuerContent">
        <!-- Configuration -->
        <div id="issuerConfig" class="section">
          <h3>Konfiguration</h3>
          <div class="form-group">
            <label class="label">API Base URL</label>
            <div class="issuerRow">
              <input
                type="text"
                id="apiBase"
                value="http://127.0.0.1:3000"
                style="flex: 1"
              />
              <button
                id="testApiBtn"
                onclick="testApi()"
                class="secondary btnTight"
                type="button"
              >
                Test API
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="label">Session Token (Bearer)</label>
            <input type="text" id="apiKey" value="" />
          </div>
          <div class="form-group">
            <label class="label">Café ID</label>
            <input type="text" id="cafeId" value="cafetest-01" />
          </div>
          <div class="form-group">
            <label class="label">TTL (seconds)</label>
            <input type="number" id="ttl" value="300" min="30" max="3600" />
          </div>
        </div>

        <!-- QR Code Display -->
        <div id="issuerQR" class="section qr-section">
          <h3>QR Code</h3>
          <div class="qr-box" id="qr">
            <div style="color: var(--text-muted); text-align: center">
              <div>„QR erstellen“ klicken, um zu starten.</div>
            </div>
          </div>
          <button class="btnPrimary" onclick="issueQR()" type="button">
            QR erstellen
          </button>
          <div id="status" class="status info">Bereit.</div>
        </div>

        <!-- Payload Display -->
        <div id="issuerPayload" class="section">
          <h3>Payload</h3>
          <div class="payload-box" id="payload">-</div>
        </div>

        <!-- Customer Scan & Quick Stamps -->
        <div class="section">
          <h3>Kunden scannen & Stempel vergeben</h3>
          <div style="margin-bottom: 8px">
            <label class="label">Kundenadresse (nach Scan)</label>
            <input type="text" id="customerAddr" placeholder="0x..." />
          </div>
          <div style="margin-bottom: 8px">
            <label class="label">Anzahl Stempel</label>
            <select id="stampCount">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="10">10</option>
            </select>
          </div>
          <div style="margin-bottom: 12px">
            <button
              class="btnPrimary"
              id="giveBtn"
              onclick="giveStamps()"
              type="button"
            >
              Stempel vergeben
            </button>
          </div>
          <div style="margin-bottom: 12px">
            <label class="label">Scan (Kamera) / Foto hochladen</label>
            <div class="qr-box" id="scanBox">
              <video
                id="scanVideo"
                playsinline
                autoplay
                style="
                  width: 100%;
                  height: 200px;
                  object-fit: cover;
                  border-radius: 0;
                  background: var(--surface-muted);
                "
              ></video>
              <div
                id="scanOverlay"
                style="
                  position: absolute;
                  left: 16px;
                  right: 16px;
                  top: 16px;
                  bottom: 16px;
                  border: 2px dashed rgba(255, 255, 255, 0.22);
                  border-radius: 0;
                  pointer-events: none;
                "
              ></div>
            </div>
            <div style="margin-top: 8px">
              <input id="scanFile" type="file" accept="image/*" />
            </div>
          </div>
          <div id="scanStatus" class="status info">Bereit zum Scannen.</div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>

    <script>
      const apiBaseEl = document.getElementById("apiBase");
      const apiKeyEl = document.getElementById("apiKey");
      const cafeIdEl = document.getElementById("cafeId");
      const ttlEl = document.getElementById("ttl");
      const qrEl = document.getElementById("qr");
      const statusEl = document.getElementById("status");
      const payloadEl = document.getElementById("payload");

      async function issueQR() {
        statusEl.textContent = "Issuing QR...";
        statusEl.className = "status loading";
        qrEl.innerHTML = "";
        payloadEl.textContent = "-";

        try {
          const apiBase = apiBaseEl.value.replace(/\/$/, "");
          const cafeId = cafeIdEl.value || "cafetest-01";
          const ttl = Number(ttlEl.value) || 300;

          const response = await fetch(apiBase + "/qr/issue", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${apiKeyEl.value}`,
            },
            body: JSON.stringify({ ttl }),
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();

          if (data.error) {
            throw new Error(data.error);
          }

          // Display payload
          payloadEl.textContent = JSON.stringify(data, null, 2);

          // --- LAN-IP für QR-Code-URL verwenden ---
          // Versuche, die API-Base-IP zu extrahieren (z.B. http://192.168.0.175:3000)
          let baseUrl = apiBaseEl.value.replace(/\/$/, "");
          let host = window.location.hostname;
          let proto = window.location.protocol;
          let port = window.location.port;
          // Wenn API-Base eine LAN-IP enthält, nutze diese für den QR-Link
          const m = baseUrl.match(/^https?:\/\/(\d+\.\d+\.\d+\.\d+)/);
          if (m) {
            host = m[1];
            proto = baseUrl.startsWith("https") ? "https:" : "http:";
            port = "8080"; // statischer Server
          }
          const url = `${proto}//${host}:${port}/stamp.html?cafeId=${encodeURIComponent(
            data.cafeId,
          )}&nonce=${encodeURIComponent(
            data.nonce,
          )}&expires=${encodeURIComponent(data.expires)}`;

          new QRCode(qrEl, {
            text: url,
            width: 300,
            height: 300,
            correctLevel: QRCode.CorrectLevel.H,
          });

          // Optionally, show the URL as text for easy copy
          const urlBox = document.createElement("div");
          urlBox.style.marginTop = "10px";
          urlBox.style.fontSize = "13px";
          urlBox.style.wordBreak = "break-all";
          urlBox.innerHTML = `<b>QR-Link:</b> <a href="${url}" target="_blank">${url}</a>`;
          qrEl.appendChild(urlBox);

          statusEl.textContent = "QR issued. Scan with your smartphone.";
          statusEl.className = "status success";
        } catch (err) {
          const msg = window.stampUI
            ? stampUI.userSafeErrorMessage(
                err,
                "QR konnte nicht erstellt werden.",
              )
            : "QR konnte nicht erstellt werden.";
          statusEl.textContent = msg;
          statusEl.className = "status error";
          payloadEl.textContent =
            window.stampUI && stampUI.isDebugEnabled && stampUI.isDebugEnabled()
              ? String(err && err.message ? err.message : err)
              : "-";
        }
      }

      const DEBUG = (function () {
        try {
          const sp = new URLSearchParams(window.location.search || "");
          if (sp.get("debug") === "1") return true;
          return localStorage.getItem("stamp_debug") === "1";
        } catch (e) {
          return false;
        }
      })();

      function dlog() {
        if (!DEBUG) return;
        try {
          console.log.apply(console, arguments);
        } catch (e) {}
      }

      function dwarn() {
        if (!DEBUG) return;
        try {
          console.warn.apply(console, arguments);
        } catch (e) {}
      }

      function derror() {
        if (!DEBUG) return;
        try {
          console.error.apply(console, arguments);
        } catch (e) {}
      }

      // Auto-focus on load
      window.addEventListener("load", () => {
        try {
          const hostApiDefault = `${location.protocol}//${location.hostname}:3000`;
          apiBaseEl.value = hostApiDefault;
        } catch (e) {
          dwarn("API Base auto-detection failed", e);
        }
        apiBaseEl.focus();
        initScanner();

        // Wenn die Seite mit Kundenadresse geöffnet wird, Barista-Modus aktivieren:
        try {
          const params = new URLSearchParams(window.location.search);
          const c =
            params.get("customer") ||
            params.get("addr") ||
            params.get("address");
          if (c && /^0x[0-9a-fA-F]{40}$/.test(c)) {
            // Prefill customer address
            customerAddrEl.value = c;

            // Hide issuer sections to avoid confusion
            const cfg = document.getElementById("issuerConfig");
            const qr = document.getElementById("issuerQR");
            const payload = document.getElementById("issuerPayload");
            if (cfg) cfg.style.display = "none";
            if (qr) qr.style.display = "none";
            if (payload) payload.style.display = "none";

            // Scan-UI ausblenden
            const scanBox = document.getElementById("scanBox");
            if (scanBox) scanBox.style.display = "none";
            if (scanFile) scanFile.style.display = "none";

            // Update header/status to indicate barista mode
            const header = document.querySelector(".header");
            if (header) header.textContent = "Stamp — Barista Mode";

            scanStatus.textContent = "Kunde geladen — bereit zum Stempeln";
            scanStatus.className = "status info";

            // API-Base automatisch auf LAN-IP setzen, falls im QR-Link enthalten
            const urlHost = window.location.hostname;
            if (/^\d+\.\d+\.\d+\.\d+$/.test(urlHost)) {
              apiBaseEl.value = `${window.location.protocol}//${urlHost}:3000`;
            }
          }
        } catch (e) {
          dwarn("prefill check failed", e);
        }
      });

      // --- Scanner for customer QR (address) ---
      let scanStream = null;
      let scanReader = null;
      const scanVideo = document.getElementById("scanVideo");
      const scanStatus = document.getElementById("scanStatus");
      const customerAddrEl = document.getElementById("customerAddr");
      const scanFile = document.getElementById("scanFile");

      function initScanner() {
        try {
          scanReader = new (window.ZXing || ZXing).BrowserMultiFormatReader();
        } catch (e) {
          dwarn("ZXing init failed", e);
          scanStatus.textContent = "QR decoder not available";
          scanStatus.className = "status error";
          return;
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices
            .getUserMedia({ video: { facingMode: "environment" } })
            .then((s) => {
              scanStream = s;
              scanVideo.srcObject = s;
              scanVideo.play();
              scanStatus.textContent = "Point camera at customer QR";
              scanStatus.className = "status info";
              scanLoop();
            })
            .catch((err) => {
              dwarn("camera failed", err);
              scanStatus.textContent = "Camera unavailable — use file upload";
              scanStatus.className = "status warning";
            });
        } else {
          scanStatus.textContent = "Camera not supported — use file upload";
          scanStatus.className = "status warning";
        }

        if (scanFile) scanFile.addEventListener("change", handleScanFile);
      }

      async function scanLoop() {
        if (!scanReader || !scanVideo) return;
        try {
          const result = await scanReader.decodeOnceFromVideoElement(scanVideo);
          if (result) {
            handleScannedText(
              result.getText ? result.getText() : result.text || "",
            );
          }
        } catch (e) {
          // ignore, retry
        }
        setTimeout(scanLoop, 500);
      }

      function handleScannedText(text) {
        // Avoid showing technical payloads (addresses/URLs) unless explicitly debugging.
        scanStatus.textContent = DEBUG ? "Decoded: " + text : "QR erkannt";
        scanStatus.className = "status success";
        // Try to extract address
        const addr = extractAddressFromText(text);
        if (addr) {
          customerAddrEl.value = addr;
        }
      }

      function extractAddressFromText(text) {
        try {
          // If it's a URL with params
          if (text.startsWith("http")) {
            const u = new URL(text);
            const p =
              u.searchParams.get("customer") ||
              u.searchParams.get("addr") ||
              u.searchParams.get("address");
            if (p && /^0x[0-9a-fA-F]{40}$/.test(p)) return p;
          }
        } catch (e) {}
        // Plain address
        const m = text.match(/0x[0-9a-fA-F]{40}/);
        return m ? m[0] : null;
      }

      async function handleScanFile(ev) {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        scanStatus.textContent = "Decoding image...";
        scanStatus.className = "status info";
        const img = document.createElement("img");
        img.style.display = "none";
        document.body.appendChild(img);
        img.onload = async () => {
          try {
            const result = await scanReader.decodeFromImageElement(img);
            const text = result.getText ? result.getText() : result.text || "";
            handleScannedText(text);
          } catch (err) {
            scanStatus.textContent = "No QR found in image";
            scanStatus.className = "status error";
          } finally {
            URL.revokeObjectURL(img.src);
            img.remove();
          }
        };
        img.src = URL.createObjectURL(file);
      }

      async function giveStamps() {
        const apiBase = apiBaseEl.value.replace(/\/$/, "");
        const token = apiKeyEl.value;
        const customer = customerAddrEl.value.trim();
        const count = Number(document.getElementById("stampCount").value || 1);
        if (!/^0x[0-9a-fA-F]{40}$/.test(customer)) {
          scanStatus.textContent = "Invalid customer address";
          scanStatus.className = "status error";
          return;
        }
        scanStatus.textContent = "Sending stamp request...";
        scanStatus.className = "status loading";

        // --- DEBUG: Zeige Ziel-URL und Daten an (opt-in via ?debug=1) ---
        dlog("[DEBUG] POST", apiBase + "/stamp-by-cafe", { customer, count });
        if (DEBUG) {
          scanStatus.textContent = `DEBUG: POST ${apiBase}/stamp-by-cafe\nBody: ${JSON.stringify(
            { customer, count },
          )}`;
        }

        try {
          const resp = await fetch(apiBase + "/stamp-by-cafe", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ customer, count }),
          });

          const ct = resp.headers.get("content-type") || "";
          if (!ct.includes("application/json")) {
            const text = await resp.text();
            throw new Error(
              `Unexpected non-JSON response from API. Are you using the correct API base?\nResponse starts with: ${text.slice(
                0,
                300,
              )}`,
            );
          }

          const data = await resp.json();
          if (data.success) {
            scanStatus.textContent = `${data.count} Stempel gesetzt. TX: ${
              data.txHash || "—"
            }`;
            scanStatus.className = "status success";
          } else {
            scanStatus.textContent = "Fehler beim Stempeln.";
            scanStatus.className = "status error";
            derror("giveStamps non-success:", data);
          }
        } catch (err) {
          scanStatus.textContent = DEBUG
            ? "Network error: " + (err.message || err)
            : "Netzwerkfehler. Bitte API-Base prüfen.";
          scanStatus.className = "status error";
          derror("giveStamps error:", err);
        }
      }

      async function testApi() {
        const apiBase = apiBaseEl.value.replace(/\/$/, "");
        const status = document.getElementById("status");
        try {
          status.textContent = "Pinging API...";
          status.className = "status loading";
          const res = await fetch(apiBase + "/health", { method: "GET" });
          const ct = res.headers.get("content-type") || "";
          if (!ct.includes("application/json")) {
            const t = await res.text();
            status.textContent =
              "Unexpected response (not JSON). Is API running?";
            status.className = "status error";
            derror("health returned non-json:", t.slice(0, 300));
            return;
          }
          const data = await res.json();
          if (data && data.status === "ok") {
            status.textContent = "API reachable: /health ok";
            status.className = "status success";
          } else {
            status.textContent = "API replied but /health not ok";
            status.className = "status error";
          }
        } catch (err) {
          status.textContent = DEBUG
            ? "API unreachable: " + (err.message || err)
            : "API nicht erreichbar.";
          status.className = "status error";
          derror("testApi error:", err);
        }
      }
    </script>
  </body>
</html>
